name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 同时验证 LTS 与当前版本，避免再出现"本地过、CI 挂"的版本差异
        node: ['20', '22']
    name: test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 测试全部使用 mock / fixture，不依赖任何生产密钥
      - name: Install
        run: npm install --no-audit --no-fund
      # 含 vercel.json functions 模式校验：这类配置错误本地测试全绿仍会让
      # Vercel 构建失败（v6.9.1 就是这样上线失败的），必须在 CI 拦下
      - name: Static check (backend syntax + frontend refs + vercel.json)
        run: node scripts/check.mjs
      - name: Unit & contract tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high || true
