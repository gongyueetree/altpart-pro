/** 按场景重排参数：命中关键词的提前，保持其余相对顺序 */
function reorderByApplication(params,appCode){
  const hints=APP_PRIORITY[appCode]||[];
  if(!hints.length)return params.slice();
  const rank=p=>{
    const t=`${p.name||""} ${p.nameEn||""}`.toLowerCase();
    const i=hints.findIndex(h=>t.includes(String(h).toLowerCase()));
    return i<0?999:i;
  };
  return params.map((p,i)=>({p,i})).sort((a,b)=>{
    const ra=rank(a.p),rb=rank(b.p);
    return ra!==rb?ra-rb:a.i-b.i;
  }).map(x=>x.p);
}

function parsePackage(name){
  if(!name)return null;
  const s=String(name).toUpperCase().replace(/\s/g,"");
  // 前置引脚数写法：10-LEAD MSOP / 20-PIN TSSOP / 8PIN SOIC
  const lead=s.match(/(\d+)-?(?:LEAD|PIN|P\b)/);
  const num=(re)=>{const m=s.match(re);return m?parseInt(m[1]):null;};
  const pinOf=(fallback)=>lead?parseInt(lead[1]):fallback;
  // 片式元件 0402/0603/0805/1206
  const chip=s.match(/\b(0201|0402|0603|0805|1206|1210|2010|2512)\b/);
  if(chip){const sizes={"0201":[0.6,0.3],"0402":[1.0,0.5],"0603":[1.6,0.8],"0805":[2.0,1.25],"1206":[3.2,1.6],"1210":[3.2,2.5],"2010":[5.0,2.5],"2512":[6.3,3.2]};
    const[L,W]=sizes[chip[1]];return{type:"chip",pins:2,bodyW:L,bodyH:W,label:chip[1]};}
  // QFN/DFN 四边或两边
  if(/QFN|DFN|VQFN|WQFN|SON/.test(s)){const n=num(/(?:QFN|DFN|SON)-?(\d+)/)||pinOf(null)||16;
    const sz=s.match(/(\d+(?:\.\d+)?)X(\d+(?:\.\d+)?)MM/)||s.match(/(\d+(?:\.\d+)?)X(\d+(?:\.\d+)?)/);
    return{type:"qfn",pins:n,bodyW:sz?parseFloat(sz[1]):3,bodyH:sz?parseFloat(sz[2]):3,hasEP:/EP|1EP/.test(s),label:name};}
  // QFP/LQFP/TQFP 四边引脚
  if(/QFP/.test(s)){const n=num(/QFP-?(\d+)/)||pinOf(null)||48;return{type:"qfp",pins:n,bodyW:7,bodyH:7,label:name};}
  // SOIC/SOP/SSOP/TSSOP/MSOP 两边
  if(/SOIC|SOP|SSOP|TSSOP|MSOP|VSSOP|SO-/.test(s)){const n=num(/(?:SOIC|SOP|SSOP|TSSOP|MSOP|VSSOP)-?(\d+)/)||pinOf(null)||8;
    const sz=s.match(/(\d+(?:\.\d+)?)X(\d+(?:\.\d+)?)MM/);
    return{type:"soic",pins:n,bodyW:sz?parseFloat(sz[1]):(n<=8?4:n<=16?6:8),bodyH:sz?parseFloat(sz[2]):(n<=8?5:n<=16?6:8),label:name};}
  // SOT-23 系列
  if(/SOT-?23|SOT-?89|SOT-?223|TSOT/.test(s)){const n=num(/-(\d+)$/)||pinOf(null)||3;
    return{type:"sot",pins:n,bodyW:2.9,bodyH:1.6,label:name};}
  // DIP
  if(/DIP|PDIP/.test(s)){const n=num(/(?:DIP)-?(\d+)/)||pinOf(null)||8;return{type:"dip",pins:n,bodyW:7,bodyH:n*1.27,label:name};}
  // BGA
  if(/BGA/.test(s)){const n=num(/BGA-?(\d+)/)||pinOf(null)||64;return{type:"bga",pins:n,bodyW:8,bodyH:8,label:name};}
  return{type:"generic",pins:pinOf(null)||num(/-(\d+)/)||8,bodyW:5,bodyH:5,label:name};
}

// KiCad 解析与渲染（移植自 kicad-part-viewer）
// 架构要点：无真实文件时生成 .kicad_mod 文本，与真实文件走同一条渲染管线
// ═══════════════════════════════════════════════════════════

// 引脚号规范化：符号写 "3"、封装写 3 或 " 3 "，EP/PAD/NC 大小写不一，必须归一后比较
// 厂商别名归一：线上曾允许同时添加 "Texas Instruments" 与 "texas instruments"
const MFR_ALIAS=[[/texas\s*instruments|^ti$/i,"TEXAS_INSTRUMENTS"],[/analog\s*devices|^adi$|linear\s*tech/i,"ANALOG_DEVICES"],
 [/stmicro|^st$/i,"STMICROELECTRONICS"],[/microchip|^atmel$/i,"MICROCHIP"],[/nxp|freescale/i,"NXP"],
 [/infineon|international\s*rectifier|cypress/i,"INFINEON"],[/on\s*semi|onsemi|fairchild/i,"ONSEMI"],
 [/maxim/i,"MAXIM"],[/renesas|intersil/i,"RENESAS"],[/兆易创新|gigadevice/i,"GIGADEVICE"],[/沁恒|^wch$/i,"WCH"],
 [/圣邦微|sgmicro/i,"SGMICRO"],[/思瑞浦|3peak/i,"3PEAK"],[/极海|geehy/i,"GEEHY"],[/矽力杰|silergy/i,"SILERGY"]];
function canonMfr(n){const s=String(n||"").trim();if(!s)return "";
  for(const[re,id]of MFR_ALIAS)if(re.test(s))return id;
  return s.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,24);}

function normPin(v){
  const s=String(v??"").trim().toUpperCase();
  if(!s)return "";
  if(/^(EP|E\.?P\.?|PAD|THERMAL(PAD)?|EXPOSED(PAD)?)$/.test(s))return "EP";
  if(/^(NC|N\.?C\.?|DNC|NOCONNECT)$/.test(s))return "NC";
  return s.replace(/^0+(?=\d)/,"");
}
const samePin=(a,b)=>{const x=normPin(a),y=normPin(b);return !!x&&x===y;};

const proxyRes=u=>(!u||typeof u!=="string")?"":(/^https?:\/\//i.test(u)?`/api/ezplm-resource?url=${encodeURIComponent(u)}`:u);

// ── S-expression 块提取（容错强于完整解析器，适合 kicad_mod）──
function sexprBlocks(txt,keyword){
  const blocks=[];let pos=0;
  while((pos=txt.indexOf(`(${keyword}`,pos))>=0){
    let depth=0,end=pos,inStr=false,esc=false;
    for(let i=pos;i<txt.length;i++){const c=txt[i];
      if(inStr){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')inStr=false;}
      else{if(c==='"')inStr=true;else if(c==="(")depth++;else if(c===")"){depth--;if(depth===0){end=i+1;break}}}}
    blocks.push(txt.slice(pos,end));pos=end;}
  return blocks;
}

// ── 封装名 → 合成 kicad_mod（无真实文件时兜底，走同一渲染路径）──
function synthKicadMod(pkgName){
  const g=parsePackage(pkgName);
  if(!g)return "";
  const {type,pins,bodyW:bw,bodyH:bh,hasEP}=g;
  let pads="";
  if(type==="chip"){
    const px=bw*0.55;
    pads=`(pad 1 smd rect (at -${px.toFixed(2)} 0) (size ${(bw*0.4).toFixed(2)} ${(bh*1.1).toFixed(2)}) (layers F.Cu))
(pad 2 smd rect (at ${px.toFixed(2)} 0) (size ${(bw*0.4).toFixed(2)} ${(bh*1.1).toFixed(2)}) (layers F.Cu))`;
  }else if(type==="sot"){
    const n=pins;
    if(n===3){pads=`(pad 1 smd rect (at -1.1 0.95) (size 1.0 0.8) (layers F.Cu))
(pad 2 smd rect (at -1.1 -0.95) (size 1.0 0.8) (layers F.Cu))
(pad 3 smd rect (at 1.1 0) (size 1.0 0.8) (layers F.Cu))`;}
    else{const per=Math.ceil(n/2),pitch=0.95;
      for(let i=0;i<per;i++){const y=-(per-1)*pitch/2+i*pitch;
        pads+=`\n(pad ${i+1} smd rect (at -1.1 ${y.toFixed(2)}) (size 1.0 0.6) (layers F.Cu))`;
        if(n-i>per)pads+=`\n(pad ${n-i} smd rect (at 1.1 ${y.toFixed(2)}) (size 1.0 0.6) (layers F.Cu))`;}}
  }else if(type==="dip"){
    const per=Math.ceil(pins/2),pitch=2.54,off=bw/2;
    for(let i=0;i<per;i++){const y=-(per-1)*pitch/2+i*pitch;
      pads+=`\n(pad ${i+1} thru_hole ${i===0?"rect":"circle"} (at -${off} ${y.toFixed(2)}) (size 1.6 1.6) (layers *.Cu))`;

(fp_line (start ${hw} ${hh}) (end ${-hw} ${hh}) (layer F.SilkS) (width 0.12))
(fp_line (start ${-hw} ${hh}) (end ${-hw} ${-hh}) (layer F.SilkS) (width 0.12))
(fp_line (start ${-hw-0.4} ${-hh-0.4}) (end ${hw+0.4} ${-hh-0.4}) (layer F.CrtYd) (width 0.05))
(fp_line (start ${hw+0.4} ${-hh-0.4}) (end ${hw+0.4} ${hh+0.4}) (layer F.CrtYd) (width 0.05))

// ── 符号：现代 .kicad_sym → legacy 中间格式 ──
function tokenizeSexpr(text){
  const t=[];let i=0;
  while(i<text.length){const c=text[i];
    if(/\s/.test(c)){i++;continue}
    if(c==="("||c===")"){t.push(c);i++;continue}
    if(c==='"'){let out="",esc=false;i++;
      while(i<text.length){const ch=text[i++];if(esc){out+=ch;esc=false}else if(ch==="\\")esc=true;else if(ch==='"')break;else out+=ch}
      t.push({quoted:true,value:out});continue}
    let j=i;while(j<text.length&&!/[\s()]/.test(text[j]))j++;
    t.push(text.slice(i,j));i=j;}
  return t;
}
function parseSexpr(text){
  const tk=tokenizeSexpr(text);let i=0;
  function p(){if(tk[i]!=="(")return tk[i++];i++;const o=[];while(i<tk.length&&tk[i]!==")")o.push(p());i++;return o}
  return p();
}
const atom=n=>(n&&typeof n==="object"&&n.quoted)?n.value:String(n??"");
const childOf=(n,k)=>Array.isArray(n)?n.find(x=>Array.isArray(x)&&atom(x[0])===k):undefined;
const childrenOf=(n,k)=>Array.isArray(n)?n.filter(x=>Array.isArray(x)&&atom(x[0])===k):[];
const xyOf=(n,k)=>{const c=childOf(n,k);return c?[Number(atom(c[1]))||0,Number(atom(c[2]))||0]:[0,0]};

function modernSymbolToLegacy(text,wantName){
  if(!text.includes("(kicad_symbol_lib"))return "";
  let root;try{root=parseSexpr(text)}catch{return ""}
  const avail=childrenOf(root,"symbol");
  const want=String(wantName||"").toLowerCase();
  const outer=avail.find(n=>atom(n[1]).toLowerCase()===want)||avail.find(n=>atom(n[1]).toLowerCase().endsWith(`:${want}`))||avail[0];
  if(!outer)return "";
  const name=atom(outer[1])||wantName||"PART";
  const nested=childrenOf(outer,"symbol");
  const S=39.3700787,n=v=>Math.round(Number(v||0)*S);
  const ang2ori=a=>{const x=(((Number(a)||0)+180)%360+360)%360;return x===0?"L":x===90?"D":x===180?"R":"U"};
  const lines=[`DEF ${name.replace(/\s+/g,"_")} U 0 20 Y Y 1 F N`,"DRAW"];
  const add=(node,unit)=>{
    for(const it of node.slice(2)){
      if(!Array.isArray(it))continue;
      const k=atom(it[0]);
      if(k==="rectangle"){const[x1,y1]=xyOf(it,"start"),[x2,y2]=xyOf(it,"end");
        const ft=atom(childOf(childOf(it,"fill")||[],"type")?.[1]);
        lines.push(`S ${n(x1)} ${n(y1)} ${n(x2)} ${n(y2)} ${unit} 1 10 ${(ft==="background"||ft==="color")?"f":"N"}`);}
      else if(k==="polyline"){const pn=childOf(it,"pts"),pts=pn?childrenOf(pn,"xy"):[];
        if(pts.length)lines.push(`P ${pts.length} ${unit} 1 10 ${pts.map(p=>`${n(atom(p[1]))} ${n(atom(p[2]))}`).join(" ")} N`);}
      else if(k==="circle"){const[cx,cy]=xyOf(it,"center");
        lines.push(`C ${n(cx)} ${n(cy)} ${n(Number(atom(childOf(it,"radius")?.[1]))||0)} ${unit} 1 10 N`);}
      else if(k==="pin"){const at=childOf(it,"at")||[];
        const x=Number(atom(at[1]))||0,y=Number(atom(at[2]))||0,a=((Number(atom(at[3]))||0)%360+360)%360;
        const len=Number(atom(childOf(it,"length")?.[1]))||2.54;
        const nm=atom(childOf(it,"name")?.[1])||"~",num=atom(childOf(it,"number")?.[1])||"~";
        lines.push(`X ${nm.replace(/\s+/g,"_")} ${num} ${n(x)} ${n(y)} ${n(len)} ${ang2ori(a)} 50 50 ${unit} 1 P`);}}};
  if(nested.length){let mu=1;
    for(const un of nested){const m=atom(un?.[1]).match(/_(\d+)_(\d+)$/);const u=m?Number(m[1]):0;mu=Math.max(mu,u||1);add(un,u||0);}
    lines[0]=`DEF ${name.replace(/\s+/g,"_")} U 0 20 Y Y ${mu} F N`;}

  lines.push("ENDDRAW","ENDDEF");return lines.join("\n");
}
function extractLegacySymbol(lib,name){
  if(!name)return "";
  const esc=String(name).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return lib.match(new RegExp(`DEF\\s+${esc}\\s+[\\s\\S]*?ENDDEF`))?.[0]||"";

// 无符号文件时合成符号（输出与 parseKicadSym 相同的结构，走同一渲染器，样式一致）
// 单位 mm，遵循 KiCad 惯例：2.54mm 引脚间距、引脚长 2.54mm、体宽随引脚名长度自适应
function synthSymbol(partNumber,pinCount,pinNames){
  const count=Math.max(2,pinCount||8);
  const left=Math.ceil(count/2),right=count-left;
  const rows=Math.max(left,right);
  const pitch=2.54, len=2.54;
  const halfH=Math.max(5.08,(rows-1)*pitch/2+2.54);
  const maxName=Math.max(4,...(pinNames||[]).map(x=>String(x||"").length));
  const halfW=Math.max(6.35,Math.min(25.4,maxName*1.3+3.81));
  const shapes=[{kind:"rect",x1:-halfW,y1:halfH,x2:halfW,y2:-halfH,filled:true}];
  const pins=[];
  const nm=i=>{const v=pinNames&&pinNames[i];return (v&&String(v).trim())?String(v).trim():"~";};
  // 无引脚名时保持 "~"（渲染器会隐藏），避免用编号冒充名称造成误解
  for(let i=0;i<left;i++){
    const y=left===1?0:(rows-1)*pitch/2-i*pitch;
    pins.push({x:-halfW-len,y,angle:0,length:len,name:nm(i),number:String(i+1)});   // angle 0 = 向右指入体
  }
  for(let i=0;i<right;i++){
    const y=right===1?0:-(rows-1)*pitch/2+i*pitch;
    pins.push({x:halfW+len,y,angle:180,length:len,name:nm(left+i),number:String(left+i+1)});
  }
  return {name:partNumber||"PART",shapes,pins,skipped:0,_synth:true};
}

function renderSymbolToSvg(txt,svg,unit,onPinClick,selectedPin){

  const name=atom(top[1])||"(未命名符号)";
  const shapes=[],pins=[];let skipped=0;
  const fillSolid=n=>{const f=childOf(n,"fill");const t=f?atom(childOf(f,"type")?.[1]):null;return t==="outline"||t==="color";};
  const XY=n=>{const c=childOf(n,"at")||n;return c?{x:Number(atom(c[1]))||0,y:Number(atom(c[2]))||0,angle:Number(atom(c[3]))||0}:null;};
  const pt=(n,k)=>{const c=childOf(n,k);return c?{x:Number(atom(c[1]))||0,y:Number(atom(c[2]))||0}:null;};
  // KiCad 子符号命名: NAME_<unit>_<style>，unit=0 表示所有单元共用
  const subs=childrenOf(top,"symbol");
  const units=[[top,0],...subs.map(u=>{
    const m=String(atom(u?.[1])||"").match(/_(\d+)_(\d+)$/);
    return [u,m?Number(m[1]):0];
  })];
  let maxUnit=1;
  for(const [unit,uno] of units){
    maxUnit=Math.max(maxUnit,uno||1);
    for(const item of (Array.isArray(unit)?unit.slice(2):[])){
      if(!Array.isArray(item))continue;
      const h=atom(item[0]);
      if(h==="rectangle"){const s=pt(item,"start"),e=pt(item,"end");
        if(s&&e)shapes.push({unit:uno,kind:"rect",x1:s.x,y1:s.y,x2:e.x,y2:e.y,filled:fillSolid(item)});else skipped++;}
      else if(h==="circle"){const c=pt(item,"center"),r=Number(atom(childOf(item,"radius")?.[1]));
        if(c&&!isNaN(r))shapes.push({unit:uno,kind:"circle",cx:c.x,cy:c.y,r,filled:fillSolid(item)});else skipped++;}
      else if(h==="polyline"){const ps=childOf(item,"pts");
        const points=ps?childrenOf(ps,"xy").map(p=>({x:Number(atom(p[1]))||0,y:Number(atom(p[2]))||0})):[];
        if(points.length>=2)shapes.push({unit:uno,kind:"polyline",points,filled:fillSolid(item)});else skipped++;}
      else if(h==="arc"){const s=pt(item,"start"),m=pt(item,"mid"),e=pt(item,"end");
        if(s&&m&&e)shapes.push({unit:uno,kind:"arc",start:s,mid:m,end:e});else skipped++;}
      else if(h==="pin"){
        const at=childOf(item,"at"),len=Number(atom(childOf(item,"length")?.[1]));
        if(!at||isNaN(len)){skipped++;continue}
        pins.push({unit:uno,x:Number(atom(at[1]))||0,y:Number(atom(at[2]))||0,angle:Number(atom(at[3]))||0,length:len,
          name:atom(childOf(item,"name")?.[1])||"",number:atom(childOf(item,"number")?.[1])||""});}
    }
  }
  if(!shapes.length&&!pins.length)throw new Error("符号中没有可渲染的图形或引脚");
  // 单元标签：仅含电源引脚的单元标注为"电源单元"
  const unitLabels={};
  for(let u=1;u<=maxUnit;u++){
    const up=pins.filter(p=>p.unit===u);
    const isPwr=up.length>0&&up.every(p=>/^(v\+|v-|vcc|vdd|vss|vee|gnd|vs\+|vs-)$/i.test(String(p.name).trim()));
    unitLabels[u]=`${String.fromCharCode(64+u)} · ${isPwr?"电源单元":"单元 "+String.fromCharCode(64+u)}`;
  }
  return {name,shapes,pins,skipped,maxUnit,unitLabels};
}

// 渲染 .kicad_sym 到 SVG DOM（mm 单位，Y 轴翻转）
function renderKicadSymTo(sym,svg,onPinClick,selPin,unit=1){
  svg.innerHTML="";
  const inU=o=>!o.unit||o.unit===0||o.unit===unit;   // unit 0 = 所有单元共用
  const shapes=(sym.shapes||[]).filter(inU), pins=(sym.pins||[]).filter(inU);
  const b={minX:Infinity,minY:Infinity,maxX:-Infinity,maxY:-Infinity};
  const add=(x,y)=>{b.minX=Math.min(b.minX,x);b.minY=Math.min(b.minY,y);b.maxX=Math.max(b.maxX,x);b.maxY=Math.max(b.maxY,y)};
  for(const s of shapes){
    if(s.kind==="rect"){add(s.x1,s.y1);add(s.x2,s.y2)}
    else if(s.kind==="circle"){add(s.cx-s.r,s.cy-s.r);add(s.cx+s.r,s.cy+s.r)}
    else if(s.kind==="polyline"){for(const p of s.points)add(p.x,p.y)}
    else{add(s.start.x,s.start.y);add(s.mid.x,s.mid.y);add(s.end.x,s.end.y)}}
  for(const p of pins){add(p.x,p.y);const r=p.angle*Math.PI/180;add(p.x+p.length*Math.cos(r),p.y+p.length*Math.sin(r));}
  if(!isFinite(b.minX)){b.minX=-10;b.maxX=10;b.minY=-10;b.maxY=10}
  const pad=6,minX=b.minX-pad,maxX=b.maxX+pad,minY=-b.maxY-pad,maxY=-b.minY+pad;
  svg.setAttribute("viewBox",`${minX} ${minY} ${maxX-minX} ${maxY-minY}`);
  const mk=(t,a={})=>{const e=document.createElementNS("http://www.w3.org/2000/svg",t);
    Object.entries(a).forEach(([k,v])=>v!=null&&e.setAttribute(k,v));return e};
  const g=mk("g",{"data-zoom-layer":"1"});svg.appendChild(g);
  const SK="#a40000",FILL="#fffdb5",W=.254;
  for(const s of shapes){
    let el;
    if(s.kind==="rect")el=mk("rect",{x:Math.min(s.x1,s.x2),y:-Math.max(s.y1,s.y2),
      width:Math.abs(s.x2-s.x1),height:Math.abs(s.y2-s.y1),fill:FILL});
    else if(s.kind==="circle")el=mk("circle",{cx:s.cx,cy:-s.cy,r:s.r,fill:s.filled?FILL:"none"});
    else if(s.kind==="polyline")el=mk("polyline",{points:s.points.map(p=>`${p.x},${-p.y}`).join(" "),fill:s.filled?FILL:"none"});
    else{const cx=2*s.mid.x-(s.start.x+s.end.x)/2,cy=2*s.mid.y-(s.start.y+s.end.y)/2;
      el=mk("path",{d:`M ${s.start.x} ${-s.start.y} Q ${cx} ${-cy} ${s.end.x} ${-s.end.y}`,fill:"none"})}
    el.setAttribute("stroke",SK);el.setAttribute("stroke-width",W);el.setAttribute("stroke-linecap","round");
    g.appendChild(el);}
  for(const p of pins){
    const r=p.angle*Math.PI/180,ex=p.x+p.length*Math.cos(r),ey=p.y+p.length*Math.sin(r);
    const sel=samePin(selPin,p.number);
    const col=sel?"#006cff":SK;
    const pg=mk("g",{style:"cursor:pointer"});
    pg.appendChild(mk("line",{x1:p.x,y1:-p.y,x2:ex,y2:-ey,stroke:"transparent","stroke-width":1.2}));
    pg.appendChild(mk("line",{x1:p.x,y1:-p.y,x2:ex,y2:-ey,stroke:col,"stroke-width":sel?W*4:W}));
    pg.appendChild(mk("circle",{cx:p.x,cy:-p.y,r:sel?.6:.35,fill:col}));
    if(sel)pg.appendChild(mk("circle",{cx:p.x,cy:-p.y,r:1.1,fill:"none",stroke:"#0047c7","stroke-width":.18}));
    if(onPinClick&&p.number){
      pg.setAttribute("role","button");pg.setAttribute("tabindex","0");
      pg.setAttribute("aria-label",`引脚 ${p.number}${p.name&&p.name!=="~"?" "+p.name:""}`);
      const fire=e=>{e.stopPropagation();onPinClick(normPin(p.number));};
      pg.addEventListener("click",fire);
      pg.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")fire(e);});
    }
    g.appendChild(pg);
    const inX=Math.cos(r),inY=-Math.sin(r),vert=Math.abs(inY)>Math.abs(inX);
    if(p.number){
      const mx=(p.x+ex)/2,my=-(p.y+ey)/2;
      const t=vert?mk("text",{x:mx-.35,y:my,"font-size":1,"text-anchor":"middle",fill:sel?"#006cff":"#7a8a80",
        transform:`rotate(-90 ${mx-.35} ${my})`}):mk("text",{x:mx,y:my-.45,"font-size":1,"text-anchor":"middle",fill:sel?"#006cff":"#7a8a80"});
      t.textContent=p.number;g.appendChild(t);}
    if(p.name&&p.name!=="~"){
      const nx=ex+inX*.8,ny=-ey+inY*.8;
      const anchor=vert?(inY>0?"end":"start"):(inX>0?"start":"end");
      const t=vert?mk("text",{x:nx,y:ny+.4,"font-size":1.15,"text-anchor":anchor,fill:sel?"#006cff":"#1a2e23",
        transform:`rotate(-90 ${nx} ${ny+.4})`}):mk("text",{x:nx,y:ny+.4,"font-size":1.15,"text-anchor":anchor,fill:sel?"#006cff":"#1a2e23"});
      t.textContent=p.name;g.appendChild(t);}}
  return pins.length;
}


// ── 按品类生成标准 eCAD 符号 ──
// 电阻/电容/电感/二极管等的原理图符号是 IEC/IEEE 标准化图形，
// 依品类生成是"准确"而非"猜测"；IC 类只能按引脚数生成矩形，属于示意。
function detectSymbolKind(text){
  const t=String(text||"").toLowerCase();
  if(/\b(resistor|res\b)|电阻/.test(t)&&!/网络|array|排阻/.test(t))return "R";
  if(/capacitor|电容/.test(t))return /电解|polarized|tantalum|钽|aluminum/.test(t)?"CP":"C";
  if(/inductor|电感|磁珠|ferrite bead/.test(t))return "L";
  if(/\bled\b|发光二极管/.test(t))return "LED";
  if(/zener|稳压二极管/.test(t))return "DZ";
  if(/schottky|肖特基/.test(t))return "DS";
  if(/diode|二极管|整流/.test(t))return "D";
  if(/crystal|晶振|谐振/.test(t))return "XTAL";
  if(/fuse|保险丝|熔断/.test(t))return "F";
  if(/mosfet|场效应/.test(t))return /p-?channel|pmos|p沟道/.test(t)?"PMOS":"NMOS";
  if(/\bbjt\b|三极管|bipolar transistor/.test(t))return /\bpnp\b/.test(t)?"PNP":"NPN";
  if(/operational amplifier|运算放大器|运放|op-?amp|variable gain amplifier|可变增益/.test(t))return "OPAMP";
  return null;
}

// 生成 parseKicadSym 兼容结构（mm 单位，KiCad 惯例）
function standardSymbol(kind,partNumber){
  const S={name:partNumber||kind,shapes:[],pins:[],skipped:0,maxUnit:1,unitLabels:{1:"A · 单元 A"},_std:kind};
  const P=(n,num,x,y,ang,len=2.54)=>S.pins.push({unit:1,x,y,angle:ang,length:len,name:n,number:String(num)});
  const line=pts=>S.shapes.push({unit:1,kind:"polyline",points:pts,filled:false});
  const rect=(x1,y1,x2,y2,f)=>S.shapes.push({unit:1,kind:"rect",x1,y1,x2,y2,filled:!!f});
  const tri=(a,b,c,f)=>S.shapes.push({unit:1,kind:"polyline",points:[a,b,c,a],filled:!!f});
  switch(kind){
    case "R":
      rect(-1.016,2.54,1.016,-2.54,false);
      P("~",1,0,5.08,270);P("~",2,0,-5.08,90);break;
    case "C":
      line([{x:-2.54,y:0.508},{x:2.54,y:0.508}]);line([{x:-2.54,y:-0.508},{x:2.54,y:-0.508}]);
      P("~",1,0,3.81,270,3.302);P("~",2,0,-3.81,90,3.302);break;
    case "CP":
      line([{x:-2.54,y:0.508},{x:2.54,y:0.508}]);
      S.shapes.push({unit:1,kind:"arc",start:{x:-2.54,y:-1.27},mid:{x:0,y:-0.508},end:{x:2.54,y:-1.27}});
      line([{x:-1.7,y:2.2},{x:-0.7,y:2.2}]);line([{x:-1.2,y:1.7},{x:-1.2,y:2.7}]);   // "+" 标记
      P("+",1,0,3.81,270,3.302);P("-",2,0,-3.81,90,3.302);break;
    case "L":
      for(let i=0;i<4;i++)S.shapes.push({unit:1,kind:"arc",
        start:{x:0,y:2.54-i*1.27},mid:{x:0.8,y:1.905-i*1.27},end:{x:0,y:1.27-i*1.27}});
      P("~",1,0,5.08,270);P("~",2,0,-5.08,90);break;
    case "D": case "DZ": case "DS": case "LED":
      tri({x:-1.27,y:1.27},{x:-1.27,y:-1.27},{x:1.27,y:0},true);
      if(kind==="DZ")line([{x:1.27,y:1.27},{x:1.27,y:-1.27},{x:1.9,y:-1.9}]);
      else if(kind==="DS")line([{x:1.9,y:1.9},{x:1.27,y:1.27},{x:1.27,y:-1.27},{x:0.64,y:-1.9}]);
      else line([{x:1.27,y:1.27},{x:1.27,y:-1.27}]);
      if(kind==="LED"){line([{x:1.8,y:2.2},{x:3.2,y:3.6}]);line([{x:2.6,y:2.2},{x:4.0,y:3.6}]);}
      P("K",1,-3.81,0,0);P("A",2,3.81,0,180);break;
    case "XTAL":
      rect(-0.762,1.905,0.762,-1.905,false);
      line([{x:-1.778,y:1.905},{x:-1.778,y:-1.905}]);line([{x:1.778,y:1.905},{x:1.778,y:-1.905}]);
      P("1",1,-3.81,0,0,2.032);P("2",2,3.81,0,180,2.032);break;
    case "F":
      rect(-2.54,1.016,2.54,-1.016,false);line([{x:-2.54,y:0},{x:2.54,y:0}]);
      P("~",1,-5.08,0,0);P("~",2,5.08,0,180);break;
    case "NPN": case "PNP":
      line([{x:0,y:2.54},{x:0,y:-2.54}]);                       // 基极竖线
      line([{x:0,y:1.27},{x:2.54,y:2.54}]);line([{x:0,y:-1.27},{x:2.54,y:-2.54}]);
      S.shapes.push({unit:1,kind:"polyline",filled:true,points:kind==="NPN"
        ?[{x:1.5,y:-1.6},{x:2.2,y:-2.3},{x:1.2,y:-2.4},{x:1.5,y:-1.6}]
        :[{x:0.5,y:-1.9},{x:1.4,y:-1.5},{x:1.2,y:-2.5},{x:0.5,y:-1.9}]});
      P("B",1,-2.54,0,0);P("C",2,2.54,5.08,270,2.54);P("E",3,2.54,-5.08,90,2.54);break;
    case "NMOS": case "PMOS":
      line([{x:-1.27,y:2.54},{x:-1.27,y:-2.54}]);               // 栅极
      line([{x:0,y:2.54},{x:0,y:1.27}]);line([{x:0,y:0.635},{x:0,y:-0.635}]);line([{x:0,y:-1.27},{x:0,y:-2.54}]);
      line([{x:0,y:1.905},{x:2.54,y:1.905},{x:2.54,y:5.08}]);
      line([{x:0,y:-1.905},{x:2.54,y:-1.905},{x:2.54,y:-5.08}]);
      S.shapes.push({unit:1,kind:"polyline",filled:true,points:kind==="NMOS"
        ?[{x:1.0,y:0},{x:0.2,y:0.6},{x:0.2,y:-0.6},{x:1.0,y:0}]
        :[{x:0.2,y:0},{x:1.0,y:0.6},{x:1.0,y:-0.6},{x:0.2,y:0}]});
      P("G",1,-3.81,0,0);P("D",2,2.54,7.62,270,2.54);P("S",3,2.54,-7.62,90,2.54);break;
    case "OPAMP":
      tri({x:-5.08,y:5.08},{x:-5.08,y:-5.08},{x:5.08,y:0},true);
      P("+",3,-7.62,2.54,0);P("-",2,-7.62,-2.54,0);P("~",1,7.62,0,180);
      P("V+",8,0,7.62,270,2.54);P("V-",4,0,-7.62,90,2.54);break;
    default: return null;
  }
  return S;
}

// 用 PDF 数据手册提取的引脚构建符号（引脚名与类型来自 datasheet）
function symbolFromPdfPins(partNumber,pdfPins){
  const list=(pdfPins||[]).filter(p=>p&&p.number);
  if(list.length<2)return null;
  const isNC=p=>p.type==="no_connect"||/^n\.?c\.?$|^nc\d*$/i.test(p.name||"");
  const isPwr=p=>p.type==="power"&&!isNC(p);
  const isIn=p=>p.type==="input"&&!isNC(p);
  const isOut=p=>p.type==="output"&&!isNC(p);
  // KiCad 惯例：输入在左，输出在右，电源上下；NC 集中排在左侧末尾，不与信号脚混排
  const nc=list.filter(isNC);
  const sig=list.filter(p=>!isNC(p));
  const left=[...sig.filter(p=>isIn(p)||(!isOut(p)&&!isPwr(p))),...nc];
  const right=sig.filter(isOut);
  const pwr=sig.filter(isPwr);
  const rows=Math.max(left.length,right.length,1);
  const pitch=2.54,len=2.54;
  const halfH=Math.max(5.08,(rows-1)*pitch/2+2.54);
  const maxName=Math.max(4,...list.map(p=>String(p.name||"").length));
  const halfW=Math.max(7.62,Math.min(30.48,maxName*1.4+5.08));
  const S={name:partNumber,shapes:[{unit:1,kind:"rect",x1:-halfW,y1:halfH,x2:halfW,y2:-halfH,filled:true}],
    pins:[],skipped:0,maxUnit:1,unitLabels:{1:"A · 单元 A"},_pdf:true};
  left.forEach((p,i)=>{const y=left.length===1?0:(left.length-1)*pitch/2-i*pitch;
    S.pins.push({unit:1,x:-halfW-len,y,angle:0,length:len,name:p.name||"~",number:String(p.number),type:p.type});});
  right.forEach((p,i)=>{const y=right.length===1?0:(right.length-1)*pitch/2-i*pitch;
    S.pins.push({unit:1,x:halfW+len,y,angle:180,length:len,name:p.name||"~",number:String(p.number),type:p.type});});
  pwr.forEach((p,i)=>{const half=Math.ceil(pwr.length/2);
    const top=i<half, k=top?i:i-half, cnt=top?half:pwr.length-half;
    const x=cnt===1?0:-(cnt-1)*pitch/2+k*pitch;
    S.pins.push({unit:1,x,y:top?halfH+len:-halfH-len,angle:top?270:90,length:len,name:p.name||"~",number:String(p.number),type:p.type});});
  return S;
}


// ── 导出为 KiCad .kicad_sym（KiCad 7/8/9 通用 S-expression 格式）──
// 格式依据 KLC 与 kicad_sym 规范；生成的符号可直接加入 KiCad 9 符号库使用。
function pinTypeToKicad(t){
  return {input:"input",output:"output",bidirectional:"bidirectional",
    power:"power_in",passive:"passive",no_connect:"no_connect"}[t]||"passive";
}
function esc(v){return String(v??"").replace(/\\/g,"\\\\").replace(/"/g,'\\"');}
function n3(v){return (Math.round(Number(v||0)*1000)/1000).toFixed(3);}

/**
 * 把内部符号结构导出为 .kicad_sym 文本
 * @param sym  {name,shapes,pins,maxUnit} —— parseKicadSym / symbolFromPdfPins / standardSymbol 的产物
 * @param meta {partNumber,footprint,datasheet,manufacturer,description,source}
 */
function exportKicadSym(sym,meta={}){
  const name=esc(meta.partNumber||sym.name||"PART");
  const units=Math.max(1,sym.maxUnit||1);
  const L=[];
  L.push(`(kicad_symbol_lib (version 20231120) (generator "AltPart Pro") (generator_version "9.0")`);
  L.push(`  (symbol "${name}"`);
  L.push(`    (exclude_from_sim no) (in_bom yes) (on_board yes)`);
  // 属性字段
  const props=[
    ["Reference","U",0,2.54,"no"],
    ["Value",name,0,-2.54,"no"],
    ["Footprint",esc(meta.footprint||""),0,-5.08,"yes"],
    ["Datasheet",esc(meta.datasheet||""),0,-7.62,"yes"],
    ["Description",esc(meta.description||""),0,-10.16,"yes"],
  ];
  if(meta.manufacturer)props.push(["Manufacturer",esc(meta.manufacturer),0,-12.7,"yes"]);
  if(meta.source)props.push(["AltPart_Source",esc(meta.source),0,-15.24,"yes"]);
  for(const[k,v,x,y,hide] of props){
    L.push(`    (property "${k}" "${v}" (at ${n3(x)} ${n3(y)} 0)`);
    L.push(`      (effects (font (size 1.27 1.27))${hide==="yes"?" (hide yes)":""})`);
    L.push(`    )`);
  }
  for(let u=1;u<=units;u++){
    const shapes=(sym.shapes||[]).filter(s=>!s.unit||s.unit===0||s.unit===u);
    const pins=(sym.pins||[]).filter(p=>!p.unit||p.unit===0||p.unit===u);
    L.push(`    (symbol "${name}_${u}_1"`);
    for(const s of shapes){
      if(s.kind==="rect"){
        L.push(`      (rectangle (start ${n3(s.x1)} ${n3(s.y1)}) (end ${n3(s.x2)} ${n3(s.y2)})`);
        L.push(`        (stroke (width 0.254) (type default)) (fill (type ${s.filled?"background":"none"}))`);
        L.push(`      )`);
      }else if(s.kind==="circle"){
        L.push(`      (circle (center ${n3(s.cx)} ${n3(s.cy)}) (radius ${n3(s.r)})`);
        L.push(`        (stroke (width 0.254) (type default)) (fill (type ${s.filled?"background":"none"}))`);
        L.push(`      )`);
      }else if(s.kind==="polyline"){
        L.push(`      (polyline (pts ${s.points.map(p=>`(xy ${n3(p.x)} ${n3(p.y)})`).join(" ")})`);
        L.push(`        (stroke (width 0.254) (type default)) (fill (type ${s.filled?"background":"none"}))`);
        L.push(`      )`);
      }else if(s.kind==="arc"){
        L.push(`      (arc (start ${n3(s.start.x)} ${n3(s.start.y)}) (mid ${n3(s.mid.x)} ${n3(s.mid.y)}) (end ${n3(s.end.x)} ${n3(s.end.y)})`);
        L.push(`        (stroke (width 0.254) (type default)) (fill (type none))`);
        L.push(`      )`);
      }
    }
    for(const p of pins){
      L.push(`      (pin ${pinTypeToKicad(p.kicadType||p.type)} line (at ${n3(p.x)} ${n3(p.y)} ${Math.round(p.angle||0)}) (length ${n3(p.length||2.54)})`);
      L.push(`        (name "${esc(p.name&&p.name!=="~"?p.name:"~")}" (effects (font (size 1.27 1.27))))`);
      L.push(`        (number "${esc(p.number)}" (effects (font (size 1.27 1.27))))`);
      L.push(`      )`);
    }
    L.push(`    )`);
  }
  L.push(`  )`);
  L.push(`)`);
  return L.join("\n");
}

function downloadText(filename,text,mime="text/plain;charset=utf-8"){
  const blob=new Blob(["\ufeff".length?text:text],{type:mime});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);
}

function Model3DSVG({pkg,svgRef,compact}){
  const g=parsePackage(pkg);
  if(!g)return <EmptyPreview text="无封装信息"/>;
  const W=760,H=480,cx=W/2,cy=H/2+20;
  const s=Math.min(200/Math.max(g.bodyW,1),200/Math.max(g.bodyH,1))*1.1;
  const w=g.bodyW*s,d=g.bodyH*s,h=Math.max(26,w*0.16);
  const ox=d*0.45,oy=d*0.26;
  const top=`${cx-w/2},${cy-h} ${cx-w/2+ox},${cy-h-oy} ${cx+w/2+ox},${cy-h-oy} ${cx+w/2},${cy-h}`;
  const right=`${cx+w/2},${cy-h} ${cx+w/2+ox},${cy-h-oy} ${cx+w/2+ox},${cy-oy} ${cx+w/2},${cy}`;
  // 引脚示意
  const leads=[];
  const per=Math.max(1,Math.ceil(g.pins/(g.type==="qfn"||g.type==="qfp"?4:2)));
  if(g.type!=="chip"&&g.type!=="bga"){
    for(let i=0;i<per;i++){
      const t=per===1?0.5:i/(per-1);
      const y=cy-h*0.35-oy*t*0.8, xl=cx-w/2, xr=cx+w/2;
      const ly=cy-h*0.2+ (d*0.5)*(t-0.5);
      leads.push(<rect key={`l${i}`} x={xl-14} y={ly} width={14} height={5} fill="#c7ccd2" rx={1}/>);
      leads.push(<rect key={`r${i}`} x={xr} y={ly-oy*0.15} width={14} height={5} fill="#c7ccd2" rx={1}/>);
    }
  }
  return(<svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:compact?250:340,background:"linear-gradient(160deg,#f7faf8,#eef3f0)",borderRadius:8,border:`1px solid ${C.borderLight}`}}>
    <defs><linearGradient id="topg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#4a6357"/><stop offset="100%" stopColor="#33463d"/></linearGradient></defs>
    {[...Array(9)].map((_,i)=>(<line key={`gx${i}`} x1={cx-260+i*65} y1={cy+40} x2={cx-200+i*65} y2={cy+8} stroke="#dde5e0" strokeWidth="1"/>))}
    <ellipse cx={cx+ox*0.5} cy={cy+10} rx={w*0.66} ry={10} fill="#00000015"/>
    {leads}
    <rect x={cx-w/2} y={cy-h} width={w} height={h} fill="#2c3e35"/>
    <polygon points={top} fill="url(#topg)"/>
    <polygon points={right} fill="#1f2d26"/>
    <circle cx={cx-w/2+16} cy={cy-h/2} r={4.5} fill="#8fd6b4"/>
    <text x={cx+ox*0.5} y={H-18} textAnchor="middle" fontSize={13} fill="#6b8578" fontFamily="'DM Mono',monospace">
      {g.label} · {g.bodyW}×{g.bodyH}mm · {g.pins}pin</text>
  </svg>);
}

// ── SVG 缩放/平移视口（移植自 kicad-part-viewer）──
function attachViewport(svg,rebase){
  // base 取渲染器写入的 viewBox（符号是 mm 单位，封装也是），不能硬编码 800x520
  const readVB=()=>{const v=(svg.getAttribute("viewBox")||"").split(/[\s,]+/).map(Number);
    return (v.length===4&&v.every(n=>isFinite(n)))?{x:v[0],y:v[1],w:v[2],h:v[3]}:{x:0,y:0,w:800,h:520};};
  if(svg&&svg._vpBound){
    if(rebase){svg._vpBase=readVB();svg._vp.reset();}    // 内容换了 → 以新 viewBox 为基准
    return svg._vp;
  }
  if(!svg)return null;
  svg._vpBase=readVB();
  const base=svg._vpBase;
  let view={...base},dragging=false,pid=null,last={x:0,y:0},down={x:0,y:0},moved=false;
  const apply=()=>svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
  const reset=()=>{view={...(svg._vpBase||base)};apply()};
  const zoomAt=(f,clientX,clientY)=>{
    const r=svg.getBoundingClientRect();if(!r.width||!r.height)return;
    const px=clientX==null?r.left+r.width/2:clientX, py=clientY==null?r.top+r.height/2:clientY;
    const ux=view.x+(px-r.left)/r.width*view.w, uy=view.y+(py-r.top)/r.height*view.h;
    const B=svg._vpBase||base;
    const nw=Math.min(B.w*8,Math.max(B.w/20,view.w*f)), nh=nw*(B.h/B.w);
    const rx=(ux-view.x)/view.w, ry=(uy-view.y)/view.h;
    view={x:ux-rx*nw,y:uy-ry*nh,w:nw,h:nh};apply();
  };
  svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY>0?1.12:.89,e.clientX,e.clientY)},{passive:false});
  svg.addEventListener("pointerdown",e=>{if(e.button!==0)return;dragging=true;moved=false;pid=e.pointerId;
    down={x:e.clientX,y:e.clientY};last={...down};svg.setPointerCapture(pid);svg.style.cursor="grabbing"});
  svg.addEventListener("pointermove",e=>{if(!dragging||e.pointerId!==pid)return;
    if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)moved=true;
    const r=svg.getBoundingClientRect();
    view.x-=(e.clientX-last.x)/r.width*view.w;view.y-=(e.clientY-last.y)/r.height*view.h;
    last={x:e.clientX,y:e.clientY};apply()});
  const stop=()=>{if(!dragging)return;dragging=false;try{svg.releasePointerCapture(pid)}catch{}pid=null;svg.style.cursor="grab"};
  svg.addEventListener("pointerup",stop);svg.addEventListener("pointercancel",stop);
  svg.addEventListener("dblclick",reset);
  svg.style.cursor="grab";svg.style.touchAction="none";
  apply();
  svg._vpBound=true;svg._vp={reset,zoomIn:()=>zoomAt(.78),zoomOut:()=>zoomAt(1.28)};
  return svg._vp;
}


// ═══════════════════════════════════════════════════════════
// STEP 3D 在线预览（移植自 ezplm-smt-scm）
// occt-import-js(OCCT WASM 内核) 解析 STEP → three.js 渲染
// 手动触发：内核约 7.6MB + STEP 文件本身 1-3MB，不应随页面自动加载
// ═══════════════════════════════════════════════════════════
// OCCT 是 UMD 构建（非 ESM），必须用 <script> 标签加载后调全局 occtimportjs()。
// 用 import() 会被 esm.sh 注入 process 垫片，导致 Emscripten 误判为 Node 环境
// 而去调 fs.readFileSync，报 "readFileSync is not a function"。
const OCCT_LOCAL="/vendor/occt-import-js.js";
const OCCT_CDN="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js";
const THREE_CDN="https://esm.sh/three@0.185.0";
const ORBIT_CDN="https://esm.sh/three@0.185.0/examples/jsm/controls/OrbitControls.js";

function loadScriptOnce(src){
  return new Promise((res,rej)=>{
    const done=[...document.scripts].some(x=>x.src&&x.src.indexOf(src)>=0);
    if(done&&window.occtimportjs)return res();
    const el=document.createElement("script");
    el.src=src;el.async=true;
    el.onload=()=>res();
    el.onerror=()=>rej(new Error(`脚本加载失败: ${src}`));
    document.head.appendChild(el);
  });
}

// 加载 OCCT 内核：本站 /vendor/ 优先 → CDN 兜底
async function loadOcct(setMsg){
  let base=null;
  try{
    const head=await fetch(OCCT_LOCAL,{method:"HEAD"});
    if(head.ok){setMsg?.("正在加载本站 3D 内核…");await loadScriptOnce(OCCT_LOCAL);base="/vendor/";}
  }catch(e){}
  if(!base){
    setMsg?.("本站内核不可用，回退 CDN…");
    await loadScriptOnce(OCCT_CDN);
    base="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/";
  }
  if(typeof window.occtimportjs!=="function")throw new Error("OCCT 内核已加载但未暴露 occtimportjs()");
  setMsg?.("正在初始化 OCCT 内核…");
  // locateFile 指向与 js 同源的 wasm
  return await window.occtimportjs({locateFile:f=>base+f});
}

function Step3DViewer({stepUrl,fileName,compact}){
  const[phase,setPhase]=useState("idle");   // idle|loading|ready|error
  const[msg,setMsg]=useState("");
  const[meshCount,setMeshCount]=useState(0);
  const hostRef=useRef(null);
  const disposeRef=useRef(null);
  useEffect(()=>()=>disposeRef.current?.(),[]);

  async function load(){
    setPhase("loading");setMsg("正在加载 3D 内核与 STEP 模型…");
    try{
      // ⚠ Babel standalone 会把静态写法的 import() 转译成 require()（浏览器无此函数）。
      // 用 new Function 构造，使动态 import 在运行时才出现，绕过编译期转换。
      // three.js 是标准 ESM，用动态 import；OCCT 是 UMD，用 script 标签
      const dynImport=new Function("u","return import(u)");
      const [occt,THREE,orbitMod]=await Promise.all([
        loadOcct(setMsg),dynImport(THREE_CDN),dynImport(ORBIT_CDN),
      ]);
      const OrbitControls=orbitMod.OrbitControls;

      setMsg("正在下载 STEP 文件…");
      const res=await fetch(proxyRes(stepUrl));
      if(!res.ok){
        const b=await res.json().catch(()=>null);
        throw new Error(b?.error||`拉取 STEP 文件失败 (HTTP ${res.status})`);
      }
      const bytes=new Uint8Array(await res.arrayBuffer());

      setMsg("正在解析几何…");
      const result=occt.ReadStepFile(bytes,null);
      if(!result?.success||!result.meshes?.length)throw new Error("STEP 解析成功但没有可显示的网格");

      const host=hostRef.current;
      if(!host)throw new Error("渲染容器不可用");
      host.innerHTML="";
      const width=host.clientWidth||600,height=380;
      const scene=new THREE.Scene();
      scene.background=new THREE.Color(0xf7faf8);
      const group=new THREE.Group();
      for(const mesh of result.meshes){
        const geo=new THREE.BufferGeometry();
        geo.setAttribute("position",new THREE.Float32BufferAttribute(mesh.attributes.position.array,3));
        if(mesh.attributes.normal)geo.setAttribute("normal",new THREE.Float32BufferAttribute(mesh.attributes.normal.array,3));
        else geo.computeVertexNormals();
        if(mesh.index)geo.setIndex(mesh.index.array);
        const color=mesh.color?new THREE.Color(mesh.color[0],mesh.color[1],mesh.color[2]):new THREE.Color(0x8a8f98);
        group.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,metalness:.25,roughness:.6})));
      }
      const box=new THREE.Box3().setFromObject(group);
      const center=box.getCenter(new THREE.Vector3());
      const size=box.getSize(new THREE.Vector3()).length()||10;
      group.position.sub(center);
      scene.add(group);
      scene.add(new THREE.AmbientLight(0xffffff,.75));
      const dir=new THREE.DirectionalLight(0xffffff,1.1);dir.position.set(1,1.4,1);scene.add(dir);
      const camera=new THREE.PerspectiveCamera(45,width/height,size/500,size*20);
      camera.position.set(size*.7,size*.6,size*.9);
      const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
      renderer.setSize(width,height);
      host.appendChild(renderer.domElement);
      const controls=new OrbitControls(camera,renderer.domElement);
      controls.enableDamping=true;
      let raf=0;
      const tick=()=>{raf=requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)};
      tick();
      const onResize=()=>{const w=host.clientWidth||width;camera.aspect=w/height;camera.updateProjectionMatrix();renderer.setSize(w,height)};
      window.addEventListener("resize",onResize);
      disposeRef.current=()=>{cancelAnimationFrame(raf);window.removeEventListener("resize",onResize);
        controls.dispose();renderer.dispose();host.innerHTML="";};
      setMeshCount(result.meshes.length);setPhase("ready");
    }catch(e){
      setPhase("error");
      setMsg(e instanceof Error?e.message:String(e));
    }
  }

  return(<div>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:8,justifyContent:compact?"center":"flex-start"}}>
      {(phase==="idle"||phase==="error")&&(
        <button onClick={load} style={{padding:compact?"7px 14px":"9px 18px",borderRadius:8,border:"none",background:C.green,color:"#fff",fontSize:compact?12:13,fontWeight:600,cursor:"pointer"}}>
          {phase==="error"?"重试加载":"▶ 加载 3D 模型"}
        </button>)}
      {!compact&&<a href={proxyRes(stepUrl)} target="_blank" rel="noreferrer" download
        style={{padding:"8px 14px",borderRadius:8,border:`1px solid ${C.border}`,background:"#fff",color:C.textSec,fontSize:12,textDecoration:"none"}}>
        ⬇ 下载 STEP 源文件</a>}
      {!compact&&<span style={{fontSize:11,color:C.textMute,flex:1,minWidth:200}}>
        {fileName?`${fileName} · `:""}需下载约 7.6MB 的 3D 内核与 STEP 文件，故手动触发。</span>}
    </div>
    {compact&&phase==="idle"&&<div style={{fontSize:10,color:C.textMute,textAlign:"center",marginBottom:6}}>约 7.6MB 内核，按需加载</div>}
    {phase==="loading"&&<div style={{padding:compact?"24px 8px":"40px",textAlign:"center",color:C.textMute}}>
      <div style={{width:28,height:28,border:`3px solid ${C.borderLight}`,borderTopColor:C.green,borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 10px"}}/>
      <div style={{fontSize:12}}>{msg}</div></div>}
    {phase==="error"&&<div style={{padding:"12px 14px",borderRadius:8,background:"#fdeaea",border:"1px solid #f5c6c6",color:"#a0302a",fontSize:12}}>
      3D 预览失败：{msg}。可下载 STEP 源文件用 KiCad / FreeCAD 打开。</div>}
    {phase==="ready"&&<div style={{fontSize:11,color:C.textMute,marginBottom:6}}>
      已渲染 {meshCount} 个网格 · 左键旋转 / 滚轮缩放 / 右键平移</div>}
    <div ref={hostRef} style={{borderRadius:8,overflow:"hidden",
      border:phase==="ready"?`1px solid ${C.borderLight}`:"none"}}/>
  </div>);
}

// ═══ 图形预览面板：符号 / 封装 / 3D 三栏并排 ═══
// eCAD 结果模块级缓存：切换 Tab 会卸载组件，重挂载时直接复用，避免重复拉取与生成
const ECAD_CACHE=new Map();   // pn -> {fpText,fpReal,symText,symReal,ksym,kskip,srcSym,srcFp,pdfWarn,extUrl}

function GraphicsPanel({d,pn}){
  const cached=ECAD_CACHE.get(pn)||null;
  const[fpText,setFpText]=useState(cached?.fpText??null);
  const[symText,setSymText]=useState(cached?.symText??null);
  const[fpReal,setFpReal]=useState(cached?.fpReal??false);
  const[symReal,setSymReal]=useState(cached?.symReal??false);
  const[ksym,setKSym]=useState(cached?.ksym??null);
  const[kskip,setKSkip]=useState(cached?.kskip??0);
  const[unit,setUnit]=useState(1);
  const[loading,setLoading]=useState(!cached);
  const[pin,setPin]=useState(null);
  const togglePin=v=>setPin(prev=>samePin(prev,v)?null:normPin(v));
  const[zoomed,setZoomed]=useState(null);
  const[srcSym,setSrcSym]=useState(cached?.srcSym??"");
  const[srcFp,setSrcFp]=useState(cached?.srcFp??"");
  const[pdfWarn,setPdfWarn]=useState(cached?.pdfWarn??"");
  const[extUrl,setExtUrl]=useState(cached?.extUrl??{});
  const[aiTry,setAiTry]=useState(false);       // 用户是否已选择尝试 AI 推断引脚
  const[aiBusy,setAiBusy]=useState(false);
  const fpRef=useRef(null),symRef=useRef(null);
  const bigFpRef=useRef(null),bigSymRef=useRef(null);
  const pkg=d?.footprint||(d?.parameters||[]).find(p=>/封装|package/i.test(p.name))?.value;

  useEffect(()=>{
    if(ECAD_CACHE.has(pn))return;      // 已缓存，不再重复生成
    let dead=false;
    (async()=>{
      setLoading(true);setPin(null);
      let ft=null,real=false;
      if(d?.footprintFileUrl){
        try{const r=await fetch(proxyRes(d.footprintFileUrl));
          if(r.ok){const t=await r.text();if(t.includes("(pad")||t.includes("(fp_")){ft=t;real=true;}}
        }catch(e){}
      }
      if(!ft)ft=synthKicadMod(pkg);
      let st=null,sreal=false,ks=null,kskp=0;
      if(d?.symbolUrl){
        try{const r=await fetch(proxyRes(d.symbolUrl));
          if(r.ok){
            const raw=await r.text();
            if(raw.includes("(kicad_symbol_lib")){
              try{const ps=parseKicadSym(raw);ks=ps;kskp=ps.skipped;sreal=true;}catch(e){}
            }
            if(!ks){
              const conv=extractLegacySymbol(raw,pn)||modernSymbolToLegacy(raw,pn)||extractLegacySymbol(raw,d?.partNumber);
              if(conv){st=conv;sreal=true;}
            }
          }
        }catch(e){}
      }
      // ── eCAD 级联：ezPLM → KiCad 官方库 → PDF 数据手册 → 标准/推算 ──
      let sSrc=sreal?"ezplm":"", fSrc=real?"ezplm":"", warn="", ext={};
      if(!ks&&!st||!real){
        try{
          const gp0=parsePackage(pkg);
          const kindGuess=detectSymbolKind(`${d?.category||""} ${d?.description||""}`)||
            (/mcu|微控制器|microcontroller/i.test(`${d?.category||""}`)?"mcu":"");
          const q=new URLSearchParams({pn});
          if(pkg)q.set("footprint",pkg);
          if(kindGuess)q.set("kind",String(kindGuess).toLowerCase());
          if(d?.datasheetUrl)q.set("datasheet",d.datasheetUrl);
          if(gp0?.pins)q.set("pins",String(gp0.pins));
          const r=await fetch(`/api/v2/ecad?${q}`);
          const e=await r.json().catch(()=>null);
          if(e?.success){
            if(!ks&&!st&&e.symbol?.text){
              try{const ps=parseKicadSym(e.symbol.text);ks=ps;kskp=ps.skipped;sSrc="kicad_official";ext.symbol=e.symbol.url;}catch(err){}
            }
            if(!ks&&!st&&e.pdfPins?.pins?.length){
              const sp=symbolFromPdfPins(pn,e.pdfPins.pins);
              if(sp){ks=sp;sSrc="pdf_datasheet";warn=e.pdfPins.warning||"";}
            }

            if(!real&&e.footprint?.text){ft=e.footprint.text;real=true;fSrc="kicad_official";ext.footprint=e.footprint.url;}
            if(e.model3d?.url)ext.model3d=e.model3d.url;
          }
        }catch(err){}
      }
      if(!ks&&!st){
        const kind=detectSymbolKind(`${d?.category||""} ${d?.description||""}`);
        const gp=parsePackage(pkg);
        // 标准符号的引脚数必须与实际封装一致（教训：AD8331ARQZ 是 SSOP-20，曾被套 5 脚运放符号）
        let stdOK=false;
        if(kind){const probe=standardSymbol(kind,pn);stdOK=!!probe&&(!gp?.pins||gp.pins===probe.pins.length);}
        if(stdOK){ks=standardSymbol(kind,pn);sSrc="standard";}
        if(!ks){
          const pinAttr=(d?.parameters||[]).find(x=>/引脚定义|pinout|pin\s*name/i.test(x.name));
          const names=pinAttr?String(pinAttr.value).split(/[,，;；]/).map(t=>t.trim()):null;
          ks=synthSymbol(pn,gp?.pins||8,names);sSrc="synth";
        }
      }
      if(!fSrc)fSrc=real?"ezplm":"synth";
      if(dead)return;
      setFpText(ft);setFpReal(real);setSymText(st);setSymReal(sreal);
      ECAD_CACHE.set(pn,{fpText:ft,fpReal:real,symText:st,symReal:sreal,ksym:ks,kskip:kskp,srcSym:sSrc,srcFp:fSrc,pdfWarn:warn,extUrl:ext});
      setKSym(ks);setKSkip(kskp);setUnit(1);setSrcSym(sSrc);setSrcFp(fSrc);setPdfWarn(warn);setExtUrl(ext);setLoading(false);
    })();
    return()=>{dead=true};
  },[d,pn,pkg]);

  // 三栏小图渲染
  useEffect(()=>{
    if(!loading&&fpRef.current&&fpText){renderFootprintToSvg(fpText,fpRef.current,togglePin,pin);attachViewport(fpRef.current,true);}
  },[loading,fpText,pin]);
  useEffect(()=>{
    if(loading||!symRef.current)return;
    if(ksym)renderKicadSymTo(ksym,symRef.current,togglePin,pin,unit);
    else if(symText)renderSymbolToSvg(symText,symRef.current,1,togglePin,pin);
    attachViewport(symRef.current,true);
  },[loading,symText,ksym,pin,unit]);
  // 放大视图渲染
  useEffect(()=>{
    if(zoomed==="footprint"&&bigFpRef.current&&fpText){renderFootprintToSvg(fpText,bigFpRef.current,togglePin,pin);attachViewport(bigFpRef.current,true);}
    if(zoomed==="symbol"&&bigSymRef.current){
      if(ksym)renderKicadSymTo(ksym,bigSymRef.current,togglePin,pin,unit);
      else if(symText)renderSymbolToSvg(symText,bigSymRef.current,1,togglePin,pin);
      attachViewport(bigSymRef.current,true);
    }
  },[zoomed,fpText,symText,ksym,pin,unit]);

  const tryAiPinout=async()=>{
    setAiBusy(true);
    try{
      const gp0=parsePackage(pkg);
      const q=new URLSearchParams({pn,aiPinout:"1"});
      if(pkg)q.set("footprint",pkg);
      if(gp0?.pins)q.set("pins",String(gp0.pins));
      const r=await fetch(`/api/v2/ecad?${q}`);
      const e=await r.json().catch(()=>null);
      if(e?.aiPinout?.pins?.length){
        const sp=symbolFromPdfPins(pn,e.aiPinout.pins);
        if(sp){
          setKSym(sp);setSrcSym("ai_pinout");setPdfWarn(e.aiPinout.warning||"");setAiTry(true);setAiBusy(false);
          const c=ECAD_CACHE.get(pn)||{};ECAD_CACHE.set(pn,{...c,ksym:sp,srcSym:"ai_pinout",pdfWarn:e.aiPinout.warning||""});
          return;
        }
      }
      setPdfWarn("AI 未能给出可信的引脚定义（引脚数不符或自评不确定），已保持仅编号符号");
      setAiTry(true);
    }catch(err){setPdfWarn("AI 引脚推断失败");}
    setAiBusy(false);
  };

  const SRC_BADGE={
    ezplm:{t:"✓ ezPLM 库文件",c:C.green,bg:C.greenLight,b:C.greenMid,tip:"来自 ezPLM 元器件库的原始 KiCad 文件"},
    kicad_official:{t:"✓ KiCad 官方库",c:C.green,bg:C.greenLight,b:C.greenMid,tip:"来自 KiCad 官方库 (gitlab.com/kicad/libraries)，符合 KLC 规范"},
    pdf_datasheet:{t:"◇ PDF数据手册生成",c:C.indigo,bg:C.indigoBg,b:C.indigoBorder,tip:"由程序解析 datasheet 引脚表生成，引脚名与类型来自原文，图形排布为自动布局，需人工确认"},
    standard:{t:"◇ 标准符号(自动生成)",c:C.indigo,bg:C.indigoBg,b:C.indigoBorder,tip:"电阻/电容/二极管等为 IEC/IEEE 标准图形，依品类生成；引脚定义请以 datasheet 为准"},
    ai_pinout:{t:"⚠ AI生成(引脚名待核)",c:C.amber,bg:C.amberBg,b:"#f0dca0",tip:"ezPLM / KiCad 官方库 / PDF 均未取得符号，引脚名由 AI 提供、布局由程序按 KiCad 惯例生成；引脚定义未经 datasheet 核对，务必人工确认"},
    synth:{t:"⚠ AI生成(仅编号)",c:C.amber,bg:C.amberBg,b:"#f0dca0",tip:"各来源均未取得引脚名，此图仅按封装引脚数推算编号，不可用于生产"},
  };
  const srcBadge=k=>{const m=SRC_BADGE[k]||SRC_BADGE.synth;
    return <span title={m.tip} style={{fontSize:10,padding:"2px 7px",borderRadius:4,whiteSpace:"nowrap",background:m.bg,color:m.c,border:`1px solid ${m.b}`}}>{m.t}</span>;};
  const badge=(ok,label)=>(
    <span title={ok?"由本系统解析绘制，字体与隐藏属性等细节可能与 KiCad 显示存在差异，以源文件为准"
                  :"ezPLM 未提供该资源，此图依封装名推算生成，非精确制造数据"}
      style={{fontSize:10,padding:"2px 7px",borderRadius:4,whiteSpace:"nowrap",
        background:ok?C.greenLight:C.amberBg,color:ok?C.green:C.amber,
        border:`1px solid ${ok?C.greenMid:"#f0dca0"}`}}>{ok?`✓ ${label}`:"⚠ 示意渲染"}</span>);

  const card=(title,extra,body,foot,onZoom,dl)=>(
    <div style={{border:`1px solid ${C.border}`,borderRadius:12,background:"#fff",padding:"12px 12px 10px",
      display:"flex",flexDirection:"column",minWidth:0}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:8}}>
        <span style={{fontSize:14,fontWeight:700,color:C.text}}>{title}</span>
        {extra}
      </div>
      <div style={{flex:1,minHeight:240,display:"flex",alignItems:"center",justifyContent:"center"}}>{body}</div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginTop:8,minHeight:22}}>
        <span style={{fontSize:10,color:C.textMute}}>{foot}</span>
        {onZoom&&<button onClick={onZoom} style={{padding:"3px 10px",borderRadius:6,border:`1px solid ${C.border}`,
          background:"#fff",color:C.textSec,fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>⛶ 放大</button>}
      </div>
      {dl&&<div style={{marginTop:8,paddingTop:8,borderTop:`1px dashed ${C.borderLight}`,
        display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center"}}>{dl}</div>}
    </div>);

  // 各栏下载区：按该栏实际来源给出对应操作
  const kicadFpLib=()=>(srcFp==="kicad_official"&&extUrl.footprint)
    ? extUrl.footprint.split("/").slice(-2)[0].replace(".pretty","") : "Package";
  const symMeta=()=>({partNumber:pn,footprint:pkg?`${kicadFpLib()}:${pkg}`:"",
    datasheet:d?.datasheetUrl||"",manufacturer:d?.manufacturer||"",description:d?.description||"",
    source:{ezplm:"ezPLM 库文件",kicad_official:"KiCad 官方库",pdf_datasheet:"PDF 数据手册解析",
      standard:"品类标准符号",ai_pinout:"AI 推断(未验证)",synth:"引脚数推算(未验证)"}[srcSym]||srcSym});

  const dlSymbol=(<React.Fragment>
    {srcSym==="ezplm"&&d?.symbolUrl&&
      <a href={proxyRes(d.symbolUrl)} target="_blank" rel="noreferrer" download style={DL_SM}>⬇ ezPLM 原始符号</a>}
    {srcSym==="kicad_official"&&extUrl.symbol&&
      <a href={extUrl.symbol} target="_blank" rel="noreferrer" style={DL_SM}>🔗 官方符号库</a>}
    {ksym&&<button onClick={()=>downloadText(`${pn}.kicad_sym`,exportKicadSym(ksym,symMeta()),"application/octet-stream")}
      style={{...DL_SM,cursor:"pointer",borderColor:C.greenMid,background:C.greenLight,color:C.green}}
      title="导出为 KiCad 7/8/9 通用格式，含来源标注">⬇ 导出 .kicad_sym</button>}
  </React.Fragment>);

  const dlFootprint=(<React.Fragment>
    {srcFp==="ezplm"&&d?.footprintFileUrl&&
      <a href={proxyRes(d.footprintFileUrl)} target="_blank" rel="noreferrer" download style={DL_SM}>⬇ {d.footprintFileName||"ezPLM 封装"}</a>}
    {srcFp==="kicad_official"&&extUrl.footprint&&
      <a href={extUrl.footprint} target="_blank" rel="noreferrer" style={DL_SM}>🔗 官方封装库</a>}
    {fpText&&<button onClick={()=>downloadText(`${(pkg||pn).replace(/[^\w.\-]/g,"_")}.kicad_mod`,fpText,"application/octet-stream")}
      style={{...DL_SM,cursor:"pointer",borderColor:C.greenMid,background:C.greenLight,color:C.green}}
      title={srcFp==="synth"?"此为依封装名推算生成的示意封装，不可直接用于生产":"导出当前显示的封装文件"}>
      ⬇ 导出 .kicad_mod</button>}
  </React.Fragment>);

  const dl3D=(<React.Fragment>
    {d?.model3dUrl&&<a href={proxyRes(d.model3dUrl)} target="_blank" rel="noreferrer" download style={DL_SM}>⬇ {d.model3dFileName||"ezPLM STEP"}</a>}
    {!d?.model3dUrl&&extUrl.model3d&&<a href={extUrl.model3d} target="_blank" rel="noreferrer" style={DL_SM}>⬇ 官方库 STEP</a>}
    {!d?.model3dUrl&&!extUrl.model3d&&<span style={{fontSize:10,color:C.textMute}}>无可下载的 3D 模型</span>}
  </React.Fragment>);

  if(loading)return(<div style={{padding:"60px",textAlign:"center",color:C.textMute}}>
    <div style={{width:28,height:28,border:`3px solid ${C.borderLight}`,borderTopColor:C.green,borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 10px"}}/>
    正在加载 KiCad 库文件…</div>);

  return(<div>
    <div className="graphics-grid" style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:14}}>

      {card("🔣 原理图符号",
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          {ksym?.maxUnit>1&&(
            <select value={unit} onChange={e=>setUnit(Number(e.target.value))}
              style={{padding:"3px 6px",borderRadius:5,border:`1px solid ${C.border}`,fontSize:11,background:"#fff",cursor:"pointer",maxWidth:130}}>
              {Array.from({length:ksym.maxUnit},(_,i)=>i+1).map(u=>(
                <option key={u} value={u}>{ksym.unitLabels?.[u]||`单元 ${u}`}</option>))}
            </select>)}
          {srcBadge(srcSym)}
        </div>,
        <div style={{width:"100%"}}>
          <svg ref={symRef} viewBox="0 0 800 520" style={{width:"100%",height:250,background:"#fffdf5",borderRadius:8,border:`1px solid ${C.borderLight}`}}/>
          {srcSym==="synth"&&!aiTry&&(
            <div style={{textAlign:"center",marginTop:8}}>
              <button onClick={tryAiPinout} disabled={aiBusy}
                style={{padding:"6px 14px",borderRadius:7,border:`1px solid ${C.amber}60`,background:C.amberBg,color:C.amber,fontSize:11,cursor:aiBusy?"wait":"pointer"}}>
                {aiBusy?"推断中…":"⚠ 尝试用 AI 推断引脚名（不可靠，需核对 datasheet）"}
              </button>
              <div style={{fontSize:10,color:C.textMute,marginTop:4}}>
                各权威来源均无此器件符号。AI 推断的引脚名曾出现整份编造的情况，仅供参考方向。
              </div>
            </div>)}
        </div>,
        pdfWarn?`⚠ ${pdfWarn}`:kskip>0?`⚠ ${kskip} 个图元未渲染`:"滚轮缩放 · 拖拽平移",
        ()=>setZoomed("symbol"),dlSymbol)}

      {card("📐 PCB 封装",srcBadge(srcFp),
        <svg ref={fpRef} viewBox="0 0 800 520" style={{width:"100%",height:250,background:"#fff",borderRadius:8,border:`1px solid ${C.borderLight}`}}/>,
        "滚轮缩放 · 拖拽平移",
        ()=>setZoomed("footprint"),dlFootprint)}

      {card("🧊 3D 模型",
        d?.model3dUrl?<span style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:C.greenLight,color:C.green,border:`1px solid ${C.greenMid}`}}>✓ 真实 STEP</span>
                     :badge(false,""),
        d?.model3dUrl
          ?<div style={{width:"100%"}}><Step3DViewer stepUrl={d.model3dUrl} fileName={d.model3dFileName} compact/></div>
          :<Model3DSVG pkg={pkg} compact/>,
        d?.model3dUrl?"点「加载 3D 模型」后可旋转":"ezPLM 未提供 STEP",
        null,dl3D)}
    </div>

    <div style={{textAlign:"center",fontSize:11,color:C.textMute,marginTop:10}}>
      💡 点击符号引脚或封装焊盘可高亮对应位置{pin!=null?` · 当前选中 Pin ${pin}`:""}
      {pin!=null&&<button onClick={()=>setPin(null)} style={{marginLeft:8,padding:"1px 8px",borderRadius:4,border:`1px solid ${C.border}`,background:"#fff",fontSize:11,cursor:"pointer"}}>清除</button>}
    </div>

    {zoomed&&zoomed!=="model3d"&&(
      <div onClick={()=>setZoomed(null)} style={{position:"fixed",inset:0,background:"rgba(26,46,35,.5)",zIndex:1100,
        display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
        <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:14,padding:16,width:"min(1000px,95vw)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:15,fontWeight:700}}>{zoomed==="symbol"?"🔣 原理图符号":"📐 PCB 封装"} · {pn}</span>
            <button onClick={()=>setZoomed(null)} style={{width:30,height:30,borderRadius:8,border:`1px solid ${C.border}`,background:"#fff",cursor:"pointer"}}>✕</button>
          </div>
          {zoomed==="symbol"
            ?<svg ref={bigSymRef} viewBox="0 0 800 520" style={{width:"100%",height:"65vh",background:"#fffdf5",borderRadius:8,border:`1px solid ${C.borderLight}`}}/>
            :<svg ref={bigFpRef} viewBox="0 0 800 520" style={{width:"100%",height:"65vh",background:"#fff",borderRadius:8,border:`1px solid ${C.borderLight}`}}/>}
          <div style={{textAlign:"center",fontSize:11,color:C.textMute,marginTop:8}}>滚轮缩放 · 拖拽平移 · 双击复位</div>
        </div>
      </div>)}
  </div>);
}

const DL_SM={padding:"5px 10px",borderRadius:6,border:"1px solid #d4e8dc",background:"#fff",color:"#4a6b58",fontSize:11,fontWeight:600,textDecoration:"none",whiteSpace:"nowrap",lineHeight:1.4};
const DL_BTN={padding:"7px 14px",borderRadius:7,border:"1px solid #d4e8dc",background:"#fff",color:"#1a6c4e",fontSize:12,fontWeight:600,textDecoration:"none",whiteSpace:"nowrap"};

// ═══ 器件详情弹窗（ezPLM 参数 / 实时行情 / 可下载资源 / 参考设计）═══
function PartDetailModal({pn,rec,onClose}){
  const[d,setD]=useState(null);
  const[loading,setLoading]=useState(true);
  const[tab,setTab]=useState("specs");
  useEffect(()=>{
    let cancelled=false;
    fetch(`/api/v2/part-detail/${encodeURIComponent(pn)}`).then(r=>r.ok?r.json():null)
      .then(x=>{if(!cancelled){setD(x||{inPLM:false});setLoading(false);}})
      .catch(()=>{if(!cancelled){setD({inPLM:false});setLoading(false);}});
    return()=>{cancelled=true};
  },[pn]);

  const m=d?.market;
  const offers=m?.offers||[];
  const params=d?.parameters||[];
  const downloads=d?.downloads||[];
  const refs=d?.referenceDesigns||[];

  return(<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(26,46,35,0.45)",zIndex:1000,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"32px 20px",overflowY:"auto",animation:"fadeUp 0.2s ease both"}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:14,maxWidth:1180,width:"100%",boxShadow:"0 24px 64px rgba(0,0,0,0.25)"}}>

      <div style={{padding:"18px 24px",borderBottom:`1px solid ${C.borderLight}`,display:"flex",alignItems:"flex-start",gap:14}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
            <span style={{fontSize:22,fontWeight:700,fontFamily:"'DM Mono',monospace",color:C.text}}>{pn}</span>
            {d?.inPLM&&<span style={{padding:"2px 8px",borderRadius:4,background:C.greenLight,color:C.green,fontSize:11,fontWeight:600,border:`1px solid ${C.greenMid}`}}>✓ ezPLM 已收录</span>}
          </div>
          <div style={{fontSize:13,color:C.textMute}}>{d?.manufacturer||rec?.manufacturer}</div>
          {d?.description&&<div style={{fontSize:13,color:C.textSec,marginTop:4}}>{d.description}</div>}
        </div>
        {m&&(m.priceUSD1!=null)&&(<div style={{textAlign:"right",minWidth:130}}>
          <div style={{fontSize:11,color:C.textMute}}>参考价格</div>
          <div style={{fontSize:26,fontWeight:700,color:C.green,fontFamily:"'DM Mono',monospace"}}>${m.priceUSD1}</div>
          <div style={{fontSize:12,color:m.stock==="有货"||m.stock==="充足"?C.green:C.amber}}>{m.stock}{m.stockQty?` · ${m.stockQty.toLocaleString()}`:""}</div>
        </div>)}
        <button onClick={onClose} style={{width:32,height:32,borderRadius:8,border:`1px solid ${C.border}`,background:"#fff",fontSize:16,cursor:"pointer",color:C.textSec}}>✕</button>
      </div>

      {loading&&<div style={{padding:"60px",textAlign:"center",color:C.textMute}}>
        <div style={{width:32,height:32,border:`3px solid ${C.borderLight}`,borderTopColor:C.green,borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 12px"}}/>
        正在加载器件详情与实时行情…
      </div>}

      {!loading&&!d?.inPLM&&(<div style={{padding:"40px",textAlign:"center",color:C.textMute}}>
        <div style={{fontSize:36,marginBottom:10}}>📭</div>
        <p style={{fontSize:14,marginBottom:6}}>该器件未收录于 ezPLM 元器件库</p>
        {m&&m.priceUSD1!=null&&<p style={{fontSize:12}}>但已获取到市场行情，见上方价格</p>}
      </div>)}

      {!loading&&d?.inPLM&&(<div>
        <div style={{display:"flex",gap:2,padding:"0 24px",borderBottom:`1px solid ${C.borderLight}`}}>
          {[["specs","技术规格"],["graphics","eCAD库"],["suppliers","供应商报价"],["downloads","资源下载"],["refs","参考设计"]].map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)} style={{padding:"11px 16px",border:"none",borderBottom:`2px solid ${tab===k?C.green:"transparent"}`,background:"none",color:tab===k?C.green:C.textSec,fontSize:13,fontWeight:tab===k?700:400,cursor:"pointer"}}>
              {l}{k==="suppliers"&&offers.length>0?` (${offers.length})`:""}{k==="downloads"&&downloads.length>0?` (${downloads.length})`:""}{k==="refs"&&refs.length>0?` (${refs.length})`:""}
            </button>))}
        </div>

        <div style={{padding:"18px 24px"}}>
          {tab==="specs"&&(params.length?(
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:"0 24px"}}>
              {params.map(p=>(<div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:`1px solid ${C.borderLight}`,fontSize:13}}>
                <span style={{color:C.textSec}}>{p.name}</span>
                <span style={{fontFamily:"'DM Mono',monospace",fontWeight:600,textAlign:"right"}}>{p.value}{p.unit?` ${p.unit}`:""}</span>
              </div>))}
            </div>):<p style={{fontSize:13,color:C.textMute}}>暂无参数数据</p>)}

          {tab==="graphics"&&<GraphicsPanel d={d} pn={pn}/>}

          {tab==="suppliers"&&(<div>
            {offers.length?(<table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead><tr style={{background:C.greenLight}}>{["供应商","库存","起订量","阶梯价格","交期",""].map(h=><th key={h} style={{padding:"9px 10px",textAlign:"left",fontSize:11,color:C.green,borderBottom:`1px solid ${C.greenMid}`}}>{h}</th>)}</tr></thead>

                <td style={{padding:"9px 10px"}}>{o.leadTimeDays?`${o.leadTimeDays}天`:"—"}</td>
                <td style={{padding:"9px 10px"}}>{o.url&&<a href={o.url} target="_blank" rel="noreferrer" style={{color:C.indigo,fontSize:11}}>查看 ↗</a>}</td>

              <div style={{fontSize:13,color:C.textMute}}>
                {m?.source==="ai_estimate"
                  ?<div><p style={{marginBottom:8}}>⚠ 暂未接入分销商 API，以下为 AI 估算，仅供参考：</p>
                     <div style={{padding:"10px 14px",borderRadius:8,background:C.amberBg,border:"1px solid #f0dca0",color:"#854f0b"}}>

          {tab==="downloads"&&(downloads.length?(
            <div style={{display:"grid",gap:8}}>
              {downloads.map((f,i)=>(<a key={i} href={f.url} target="_blank" rel="noreferrer"

                <span style={{fontSize:20}}>{f.type==="datasheet"?"📄":f.type==="symbol"?"🔣":f.type==="footprint"?"📐":"🧊"}</span>
                <span style={{flex:1,fontSize:13,fontWeight:600}}>{f.label}</span>
                <span style={{color:C.indigo,fontSize:12}}>下载 ↓</span>
              </a>))}
            </div>):<p style={{fontSize:13,color:C.textMute}}>暂无可下载资源</p>)}

          {tab==="refs"&&(refs.length?(
            <div style={{display:"grid",gap:10}}>
              {refs.map((r,i)=>(<a key={i} href={r.link||"#"} target="_blank" rel="noreferrer"
                style={{display:"flex",gap:12,padding:"12px 14px",borderRadius:8,border:`1px solid ${C.border}`,textDecoration:"none",color:C.text}}>
                {r.image&&<img src={r.image} alt="" style={{width:64,height:64,objectFit:"cover",borderRadius:6}}/>}
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,color:C.green}}>{r.name}</div>
                  {r.description&&<div style={{fontSize:12,color:C.textMute,marginTop:3}}>{r.description}</div>}
                </div>

function Workbench({original,demoNote,onBack,onSwitchVariant}){
  const isNAv=v=>v==null||/^n\/?a$/i.test(String(v).trim());
  const[params,setParams]=useState((original.parameters||[]).filter(p=>!isNAv(p.value)).slice(0,10));
  const[constraints,setConstraints]=useState({});
  const[mfrs,setMfrs]=useState([]);
  const[mfrInput,setMfrInput]=useState("");
  const[mode,setMode]=useState("funcCompat");
  const[application,setApplication]=useState("generic");
  const[showVariants,setShowVariants]=useState(false);
  const[orderSource,setOrderSource]=useState("default");   // default | scenario | user_override
  const[reorderNote,setReorderNote]=useState("");
  const[phase,setPhase]=useState("idle"); // idle|loading|done
  const[result,setResult]=useState(null);
  const[note,setNote]=useState(demoNote||"");
  const[view,setView]=useState("cards");
  const[detailPN,setDetailPN]=useState(null);
  const[detailRec,setDetailRec]=useState(null);
  const onShowSelf=()=>{setDetailPN(original.partNumber);setDetailRec({manufacturer:original.manufacturer});};
  const[market,setMarket]=useState(null);   // {PN: {priceUSD1,stock,channels,source}}
  const[dragging,setDragging]=useState(null);
  const dragFrom=useRef(null);

  const onDragStart=(e,i)=>{dragFrom.current=i;setDragging(i);};
  const onDragOver=(e,i)=>{e.preventDefault();};
  const onDrop=(e,i)=>{
    e.preventDefault();
    const from=dragFrom.current;
    if(from==null||from===i)return void setDragging(null);
    const next=[...params];const[m]=next.splice(from,1);next.splice(i,0,m);
    setParams(next);setDragging(null);dragFrom.current=null;
    setOrderSource("user_override");
    setReorderNote("已按你手动调整的顺序提交；场景切换不会覆盖它");
  };
  const setCon=(pid,c)=>setConstraints(prev=>{const n={...prev};if(c)n[pid]=c;else delete n[pid];return n;});
  const addMfr=()=>{
    const v=mfrInput.trim();
    if(!v){setMfrInput("");return;}
    const key=canonMfr(v);
    if(mfrs.some(x=>canonMfr(x)===key)){setMfrInput("");return;}   // 大小写/别名去重
    setMfrs([...mfrs,v]);setMfrInput("");
  };
  const mfrSuggest=mfrInput?POPULAR_MFRS.filter(m=>m.toLowerCase().includes(mfrInput.toLowerCase())&&!mfrs.includes(m)).slice(0,5):[];

  const fetchMarket=async(pns)=>{
    setMarket(null);
    try{
      const r=await fetch("/api/v2/market",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({partNumbers:pns})});
      const d=await r.json().catch(()=>null);
      if(d&&d.success)setMarket(d.parts||{});
      else setMarket({});
    }catch(e){setMarket({});}
  };

  const ERR_TEXT={
    NO_VERIFIED_CANDIDATES:"没有找到满足当前模式与约束的已验证候选",
    PIN_EVIDENCE_MISSING:"该模式需要引脚映射证据，当前候选均无法验证引脚",
    PART_UNVERIFIED:"原型号未经权威来源验证，无法推荐",
    VARIANT_NOT_RESOLVED:"未能确定具体订货型号，请先选择封装变体",
    INVALID_REQUEST:"请求参数有误",
    UPSTREAM_TIMEOUT:"上游服务超时",
    UPSTREAM_UNAVAILABLE:"上游服务不可用",
    AI_INVALID_RESPONSE:"AI 返回格式异常",
    RATE_LIMITED:"调用过于频繁",
    INTERNAL_ERROR:"服务内部错误",
  };

  const runRecommend=async()=>{
    if(phase==="loading")return;                        // 防重复点击造成并发重复请求
    setPhase("loading");setNote("");
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),45000);      // 可配置超时，超时后允许安全重试
    try{
      const r=await fetch("/api/v2/recommend",{method:"POST",headers:{"Content-Type":"application/json"},
        signal:ctl.signal,
        body:JSON.stringify({partNumber:original.partNumber,mode,application,preferredManufacturers:mfrs,constraints,
          priorityOrder:params.map(p=>p.id),orderSource,original:original._dataPath==="demo"?undefined:original})});
      clearTimeout(timer);
      const ct=r.headers.get("content-type")||"";
      const d=ct.includes("json")?await r.json().catch(()=>null):null;

      if(r.ok&&d&&d.success&&d.recommendations?.length){
        setResult(d);setPhase("done");
        return;
      }
      if(original.partNumber==="STM32F103C8T6"&&original._dataPath==="demo"){
        setResult({recommendations:MOCK_RECS,eliminated:[]});
        setNote("演示模式数据");setPhase("done");
        return;
      }
      // 业务错误：error 是对象，必须逐字段读取，不能直接拼进模板串（否则显示 [object Object]）
      const e=d&&d.error;
      if(e&&typeof e==="object"){
        const n=e.details?.eliminatedCount;
        setNote(`${ERR_TEXT[e.code]||e.message||"推荐失败"}`+
          `${typeof n==="number"?`（已排除 ${n} 个候选，见下方淘汰列表）`:""}`+
          `${e.retryable?" · 可重试":""} · ${e.code||""} · ${e.requestId||""}`);
        setResult(e.details?.eliminated?.length
          ?{recommendations:[],eliminated:e.details.eliminated,pipeline:e.details.pipeline}
          :null);
      }else{
        setNote(`推荐失败（HTTP ${r.status}）${d?"":"，响应非 JSON"}`);
        setResult(null);
      }
      setPhase("idle");
    }catch(err){
      clearTimeout(timer);
      setNote(err.name==="AbortError"
        ?"推荐超时（45 秒）。可点击重试；若持续超时，建议缩小约束范围或稍后再试"
        :`无法连接后端：${err.message||"网络错误"}`);
      setResult(null);setPhase("idle");
    }
  };

  const exportMD=()=>{
    if(!result)return;
    let md=`# ${original.partNumber} 替代料推荐\n\n| # | 型号 | 厂商 | 等级 | 结论可信度 |\n|---|------|------|------|------|\n`;
    result.recommendations.forEach((r,i)=>{md+=`| ${i+1} | ${r.partNumber} | ${r.manufacturer} | ${r.replacementLevel.level} ${r.replacementLevel.label} | ${r.confidence??r.overallScore} |\n`;});
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+md],{type:"text/markdown"}));a.download=`${original.partNumber}_替代推荐.md`;a.click();
  };
  const exportCSV=()=>{
    if(!result)return;
    let csv="\uFEFF型号,厂商,等级,技术兼容,证据覆盖,来源可信,结论可信\n";
    result.recommendations.forEach(r=>{csv+=`${r.partNumber},${r.manufacturer},${r.replacementLevel.level},${r.technical??""},${r.evidenceCoverage??""},${r.sourceConfidence??""},${r.confidence??r.overallScore}\n`;});
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`${original.partNumber}_替代推荐.csv`;a.click();
  };

  return(<div className="workbench" style={{maxWidth:1400,margin:"16px auto",padding:"0 20px",display:"grid",gridTemplateColumns:"400px 1fr",gap:18,alignItems:"start"}}>
    {/* ══ 左栏 ══ */}
    <div>
      <div style={{borderRadius:12,border:`1.5px solid ${C.border}`,background:"#fff",padding:"16px 18px",marginBottom:14}}>
        <span style={{padding:"3px 10px",borderRadius:5,background:C.greenLight,color:C.green,fontSize:12,fontWeight:600,border:`1px solid ${C.greenMid}`}}>{original.category||"元器件"}</span>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
          <span style={{fontSize:21,fontWeight:700,fontFamily:"'DM Mono',monospace",color:C.text}}>{original.partNumber}</span>
          {(original._dataPath==="local_db"||original._dataPath==="local_db+ai")&&<span style={{padding:"2px 7px",borderRadius:4,background:C.greenLight,color:C.green,fontSize:10,fontWeight:600,border:`1px solid ${C.greenMid}`}}>📦 ezPLM</span>}
          {original._dataPath==="local_db+ai"&&<span style={{padding:"2px 7px",borderRadius:4,background:C.amberBg,color:C.amber,fontSize:10,fontWeight:600,border:"1px solid #f0dca0"}}>+AI补充参数</span>}
          {original._dataPath==="ai_search"&&<span style={{padding:"2px 7px",borderRadius:4,background:C.amberBg,color:C.amber,fontSize:10,fontWeight:600,border:"1px solid #f0dca0"}}>🌐 AI搜索</span>}
        </div>
        {original.manufacturer&&<div style={{fontSize:13,color:C.textMute,marginTop:5}}>{original.manufacturer}</div>}
        {original.description&&<div style={{fontSize:13,color:C.textSec,marginTop:3}}>{original.description}</div>}
        {(original.datasheetUrl||original.footprintFileUrl||original.model3dUrl||original.symbolUrl||original.productUrl)&&(
        <div style={{marginTop:12,paddingTop:12,borderTop:`1px dashed ${C.borderLight}`}}>
          <div style={{fontSize:12,fontWeight:600,color:C.textSec,marginBottom:8}}>📦 库文件与资源</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {original.datasheetUrl&&<a href={original.datasheetUrl} target="_blank" rel="noreferrer" style={RES_BTN}>📄 Datasheet</a>}
            {original.footprintFileUrl&&<a href={original.footprintFileUrl} target="_blank" rel="noreferrer" style={RES_BTN} title={original.footprintFileName}>📐 KiCad封装</a>}
            {original.model3dUrl&&<a href={original.model3dUrl} target="_blank" rel="noreferrer" style={RES_BTN} title={original.model3dFileName}>🧊 3D模型(STEP)</a>}
            {original.symbolUrl&&<a href={original.symbolUrl} target="_blank" rel="noreferrer" style={RES_BTN}>🔣 原理图符号</a>}
            {original.productUrl&&<a href={original.productUrl} target="_blank" rel="noreferrer" style={RES_BTN}>🔗 官网产品页</a>}
          </div>
          <button onClick={()=>onShowSelf&&onShowSelf()}
            style={{marginTop:8,width:"100%",padding:"8px",borderRadius:7,border:`1px solid ${C.greenMid}`,background:C.greenLight,color:C.green,fontSize:12,fontWeight:600,cursor:"pointer"}}>
            🔍 查看 eCAD 库（符号 / 封装 / 3D）与完整详情
          </button>
        </div>)}

        {(original.variants||[]).length>0&&(
          <button onClick={()=>setShowVariants(v=>!v)}
            style={{marginTop:10,width:"100%",padding:"7px",borderRadius:7,border:`1px solid ${C.indigoBorder}`,background:C.indigoBg,color:C.indigo,fontSize:12,fontWeight:600,cursor:"pointer"}}>
            🔄 该型号有 {original.variants.length} 个封装/订货变体 · {showVariants?"收起":"点击切换"}
          </button>)}
        {showVariants&&(<div style={{marginTop:8,maxHeight:220,overflowY:"auto"}}>
          {original.variants.map((v,i)=>(
            <div key={i} onClick={()=>onSwitchVariant&&onSwitchVariant(v)}
              style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:7,border:`1px solid ${C.borderLight}`,marginBottom:5,cursor:"pointer",background:"#fff"}}
              onMouseEnter={e=>{e.currentTarget.style.background=C.greenLight;e.currentTarget.style.borderColor=C.greenMid}}
              onMouseLeave={e=>{e.currentTarget.style.background="#fff";e.currentTarget.style.borderColor=C.borderLight}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,fontFamily:"'DM Mono',monospace",color:C.green}}>{v.pn}</div>
