function parsePackage(name){
  if(!name)return null;
  const s=String(name).toUpperCase().replace(/\s/g,"");
  // 前置引脚数写法：10-LEAD MSOP / 20-PIN TSSOP / 8PIN SOIC
  const lead=s.match(/(\d+)-?(?:LEAD|PIN|P\b)/);
  const num=(re)=>{const m=s.match(re);return m?parseInt(m[1]):null;};
  const pinOf=(fallback)=>lead?parseInt(lead[1]):fallback;
  // 片式元件 0402/0603/0805/1206
  const chip=s.match(/\b(0201|0402|0603|0805|1206|1210|2010|2512)\b/);
  if(chip){const sizes={"0201":[0.6,0.3],"0402":[1.0,0.5],"0603":[1.6,0.8],"0805":[2.0,1.25],"1206":[3.2,1.6],"1210":[3.2,2.5],"2010":[5.0,2.5],"2512":[6.3,3.2]};
    const[L,W]=sizes[chip[1]];return{type:"chip",pins:2,bodyW:L,bodyH:W,label:chip[1]};}
  // QFN/DFN 四边或两边
  if(/QFN|DFN|VQFN|WQFN|SON/.test(s)){const n=num(/(?:QFN|DFN|SON)-?(\d+)/)||pinOf(null)||16;
    const sz=s.match(/(\d+(?:\.\d+)?)X(\d+(?:\.\d+)?)MM/)||s.match(/(\d+(?:\.\d+)?)X(\d+(?:\.\d+)?)/);
    return{type:"qfn",pins:n,bodyW:sz?parseFloat(sz[1]):3,bodyH:sz?parseFloat(sz[2]):3,hasEP:/EP|1EP/.test(s),label:name};}
  // QFP/LQFP/TQFP 四边引脚
  if(/QFP/.test(s)){const n=num(/QFP-?(\d+)/)||pinOf(null)||48;return{type:"qfp",pins:n,bodyW:7,bodyH:7,label:name};}
  // SOIC/SOP/SSOP/TSSOP/MSOP 两边
  if(/SOIC|SOP|SSOP|TSSOP|MSOP|VSSOP|SO-/.test(s)){const n=num(/(?:SOIC|SOP|SSOP|TSSOP|MSOP|VSSOP)-?(\d+)/)||pinOf(null)||8;
    const sz=s.match(/(\d+(?:\.\d+)?)X(\d+(?:\.\d+)?)MM/);
    return{type:"soic",pins:n,bodyW:sz?parseFloat(sz[1]):(n<=8?4:n<=16?6:8),bodyH:sz?parseFloat(sz[2]):(n<=8?5:n<=16?6:8),label:name};}
  // SOT-23 系列
  if(/SOT-?23|SOT-?89|SOT-?223|TSOT/.test(s)){const n=num(/-(\d+)$/)||pinOf(null)||3;
    return{type:"sot",pins:n,bodyW:2.9,bodyH:1.6,label:name};}
  // DIP
  if(/DIP|PDIP/.test(s)){const n=num(/(?:DIP)-?(\d+)/)||pinOf(null)||8;return{type:"dip",pins:n,bodyW:7,bodyH:n*1.27,label:name};}
  // BGA
  if(/BGA/.test(s)){const n=num(/BGA-?(\d+)/)||pinOf(null)||64;return{type:"bga",pins:n,bodyW:8,bodyH:8,label:name};}
  return{type:"generic",pins:pinOf(null)||num(/-(\d+)/)||8,bodyW:5,bodyH:5,label:name};
}

const proxyRes=u=>(!u||typeof u!=="string")?"":(/^https?:\/\//i.test(u)?`/api/ezplm-resource?url=${encodeURIComponent(u)}`:u);

// ── S-expression 块提取（容错强于完整解析器，适合 kicad_mod）──
function sexprBlocks(txt,keyword){
  const blocks=[];let pos=0;
  while((pos=txt.indexOf(`(${keyword}`,pos))>=0){
    let depth=0,end=pos,inStr=false,esc=false;
    for(let i=pos;i<txt.length;i++){const c=txt[i];
      if(inStr){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')inStr=false;}
      else{if(c==='"')inStr=true;else if(c==="(")depth++;else if(c===")"){depth--;if(depth===0){end=i+1;break}}}}
    blocks.push(txt.slice(pos,end));pos=end;}
  return blocks;
}

// ── 封装名 → 合成 kicad_mod（无真实文件时兜底，走同一渲染路径）──
function synthKicadMod(pkgName){
  const g=parsePackage(pkgName);
  if(!g)return "";
  const {type,pins,bodyW:bw,bodyH:bh,hasEP}=g;
  let pads="";
  if(type==="chip"){
    const px=bw*0.55;
    pads=`(pad 1 smd rect (at -${px.toFixed(2)} 0) (size ${(bw*0.4).toFixed(2)} ${(bh*1.1).toFixed(2)}) (layers F.Cu))
(pad 2 smd rect (at ${px.toFixed(2)} 0) (size ${(bw*0.4).toFixed(2)} ${(bh*1.1).toFixed(2)}) (layers F.Cu))`;
  }else if(type==="sot"){
    const n=pins;
    if(n===3){pads=`(pad 1 smd rect (at -1.1 0.95) (size 1.0 0.8) (layers F.Cu))
(pad 2 smd rect (at -1.1 -0.95) (size 1.0 0.8) (layers F.Cu))
(pad 3 smd rect (at 1.1 0) (size 1.0 0.8) (layers F.Cu))`;}
    else{const per=Math.ceil(n/2),pitch=0.95;
      for(let i=0;i<per;i++){const y=-(per-1)*pitch/2+i*pitch;
        pads+=`\n(pad ${i+1} smd rect (at -1.1 ${y.toFixed(2)}) (size 1.0 0.6) (layers F.Cu))`;
        if(n-i>per)pads+=`\n(pad ${n-i} smd rect (at 1.1 ${y.toFixed(2)}) (size 1.0 0.6) (layers F.Cu))`;}}
  }else if(type==="dip"){
    const per=Math.ceil(pins/2),pitch=2.54,off=bw/2;
    for(let i=0;i<per;i++){const y=-(per-1)*pitch/2+i*pitch;
      pads+=`\n(pad ${i+1} thru_hole ${i===0?"rect":"circle"} (at -${off} ${y.toFixed(2)}) (size 1.6 1.6) (layers *.Cu))`;
      pads+=`\n(pad ${pins-i} thru_hole circle (at ${off} ${y.toFixed(2)}) (size 1.6 1.6) (layers *.Cu))`;}
  }else if(type==="qfn"||type==="qfp"){
    const per=Math.max(1,Math.ceil(pins/4)),pitch=bw/(per+0.6);
    const ext=type==="qfn"?0.35:0.9, padL=type==="qfn"?0.5:1.1, padW=Math.max(0.2,pitch*0.55);
    if(hasEP)pads+=`\n(pad 9 smd rect (at 0 0) (size ${(bw*0.5).toFixed(2)} ${(bh*0.5).toFixed(2)}) (layers F.Cu))`;
    for(let i=0;i<per;i++){
      const q=-((per-1)*pitch)/2+i*pitch;
      pads+=`\n(pad ${i+1} smd rect (at -${(bw/2+ext).toFixed(2)} ${q.toFixed(2)}) (size ${padL} ${padW.toFixed(2)}) (layers F.Cu))`;
      pads+=`\n(pad ${i+1+per} smd rect (at ${q.toFixed(2)} ${(bh/2+ext).toFixed(2)}) (size ${padW.toFixed(2)} ${padL}) (layers F.Cu))`;
      pads+=`\n(pad ${i+1+per*2} smd rect (at ${(bw/2+ext).toFixed(2)} ${(-q).toFixed(2)}) (size ${padL} ${padW.toFixed(2)}) (layers F.Cu))`;
      pads+=`\n(pad ${i+1+per*3} smd rect (at ${(-q).toFixed(2)} -${(bh/2+ext).toFixed(2)}) (size ${padW.toFixed(2)} ${padL}) (layers F.Cu))`;}
  }else if(type==="bga"){
    const n=Math.ceil(Math.sqrt(pins)),pitch=bw/n;
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      const x=-bw/2+pitch*(c+0.5),y=-bh/2+pitch*(r+0.5);
      pads+=`\n(pad ${r*n+c+1} smd circle (at ${x.toFixed(2)} ${y.toFixed(2)}) (size ${(pitch*0.55).toFixed(2)} ${(pitch*0.55).toFixed(2)}) (layers F.Cu))`;}
  }else{ // soic / generic 两侧引脚
    const per=Math.ceil(pins/2),pitch=Math.min(1.27,bh/(per+0.4)),off=bw/2+0.8;
    for(let i=0;i<per;i++){const y=-(per-1)*pitch/2+i*pitch;
      pads+=`\n(pad ${i+1} smd ${i===0?"rect":"roundrect"} (at -${off.toFixed(2)} ${y.toFixed(2)}) (size 1.5 ${(pitch*0.5).toFixed(2)}) (layers F.Cu))`;
      if(pins-i>per)pads+=`\n(pad ${pins-i} smd roundrect (at ${off.toFixed(2)} ${y.toFixed(2)}) (size 1.5 ${(pitch*0.5).toFixed(2)}) (layers F.Cu))`;}
  }
  const hw=bw/2,hh=bh/2;
  return `(module SYNTH (layer F.Cu)
(fp_line (start ${-hw} ${-hh}) (end ${hw} ${-hh}) (layer F.SilkS) (width 0.12))
(fp_line (start ${hw} ${-hh}) (end ${hw} ${hh}) (layer F.SilkS) (width 0.12))
(fp_line (start ${hw} ${hh}) (end ${-hw} ${hh}) (layer F.SilkS) (width 0.12))
(fp_line (start ${-hw} ${hh}) (end ${-hw} ${-hh}) (layer F.SilkS) (width 0.12))
(fp_line (start ${-hw-0.4} ${-hh-0.4}) (end ${hw+0.4} ${-hh-0.4}) (layer F.CrtYd) (width 0.05))
(fp_line (start ${hw+0.4} ${-hh-0.4}) (end ${hw+0.4} ${hh+0.4}) (layer F.CrtYd) (width 0.05))
(fp_line (start ${hw+0.4} ${hh+0.4}) (end ${-hw-0.4} ${hh+0.4}) (layer F.CrtYd) (width 0.05))
(fp_line (start ${-hw-0.4} ${hh+0.4}) (end ${-hw-0.4} ${-hh-0.4}) (layer F.CrtYd) (width 0.05))
${pads}
)`;
}

// ── 封装渲染：解析 kicad_mod → SVG（真实几何）──
function renderFootprintToSvg(txt,svg,onPinClick,selectedPin){
  svg.innerHTML="";
  const vb=svg.viewBox?.baseVal,w=vb?.width||800,h=vb?.height||520;
  const mk=(t,a={})=>{const e=document.createElementNS("http://www.w3.org/2000/svg",t);Object.entries(a).forEach(([k,v])=>v!=null&&e.setAttribute(k,v));return e;};
  const graphics=[];

function tokenizeSexpr(text){

      t.push({quoted:true,value:out});continue}
    let j=i;while(j<text.length&&!/[\s()]/.test(text[j]))j++;
    t.push(text.slice(i,j));i=j;}

// 无符号文件时按引脚数生成通用符号（尺寸随引脚数自适应，避免拥挤）
function genericSymbol(partNumber,pinCount,pinNames){

  const rows=Math.max(left,right);
  const pitch=100;                                  // 每引脚间距（KiCad 内部单位）
  const halfH=Math.max(200,(rows-1)*pitch/2+120);   // body 高度随引脚数增长
  const halfW=Math.max(220,Math.min(520,count*8));  // body 宽度
  const stub=180;                                   // 引脚长度
  const L=[`DEF PART U 0 5 Y Y 1 F N`,"DRAW",`S ${-halfW} ${halfH} ${halfW} ${-halfH} 0 1 10 F`];
  const nm=i=>{const v=pinNames&&pinNames[i];return (v&&String(v).trim())?String(v).trim().replace(/\s+/g,"_"):"~";};
  for(let i=0;i<left;i++){
    const y=Math.round(left===1?0:(rows-1)*pitch/2-i*pitch);
    L.push(`X ${nm(i)} ${i+1} ${-halfW-stub} ${y} ${stub} R 50 50 1 1 P`);
  }
  for(let i=0;i<right;i++){
    const y=Math.round(right===1?0:-(rows-1)*pitch/2+i*pitch);
    L.push(`X ${nm(left+i)} ${left+i+1} ${halfW+stub} ${y} ${stub} L 50 50 1 1 P`);

function parseKicadSym(src){
  const root=parseSexpr(src);
  const tops=childrenOf(root,"symbol");
  const top=tops[0];
  if(!top)throw new Error("未找到 symbol 定义");
  const name=atom(top[1])||"(未命名符号)";
  const shapes=[],pins=[];let skipped=0;
  const fillSolid=n=>{const f=childOf(n,"fill");const t=f?atom(childOf(f,"type")?.[1]):null;return t==="outline"||t==="color";};
  const XY=n=>{const c=childOf(n,"at")||n;return c?{x:Number(atom(c[1]))||0,y:Number(atom(c[2]))||0,angle:Number(atom(c[3]))||0}:null;};
  const pt=(n,k)=>{const c=childOf(n,k);return c?{x:Number(atom(c[1]))||0,y:Number(atom(c[2]))||0}:null;};
  const units=[top,...childrenOf(top,"symbol")];
  for(const unit of units){
    for(const item of (Array.isArray(unit)?unit.slice(2):[])){
      if(!Array.isArray(item))continue;
      const h=atom(item[0]);
      if(h==="rectangle"){const s=pt(item,"start"),e=pt(item,"end");
        if(s&&e)shapes.push({kind:"rect",x1:s.x,y1:s.y,x2:e.x,y2:e.y,filled:fillSolid(item)});else skipped++;}
      else if(h==="circle"){const c=pt(item,"center"),r=Number(atom(childOf(item,"radius")?.[1]));
        if(c&&!isNaN(r))shapes.push({kind:"circle",cx:c.x,cy:c.y,r,filled:fillSolid(item)});else skipped++;}
      else if(h==="polyline"){const ps=childOf(item,"pts");
        const points=ps?childrenOf(ps,"xy").map(p=>({x:Number(atom(p[1]))||0,y:Number(atom(p[2]))||0})):[];
        if(points.length>=2)shapes.push({kind:"polyline",points,filled:fillSolid(item)});else skipped++;}
      else if(h==="arc"){const s=pt(item,"start"),m=pt(item,"mid"),e=pt(item,"end");
        if(s&&m&&e)shapes.push({kind:"arc",start:s,mid:m,end:e});else skipped++;}
      else if(h==="pin"){
        const at=childOf(item,"at"),len=Number(atom(childOf(item,"length")?.[1]));
        if(!at||isNaN(len)){skipped++;continue}
        pins.push({x:Number(atom(at[1]))||0,y:Number(atom(at[2]))||0,angle:Number(atom(at[3]))||0,length:len,
          name:atom(childOf(item,"name")?.[1])||"",number:atom(childOf(item,"number")?.[1])||""});}
    }
  }
  if(!shapes.length&&!pins.length)throw new Error("符号中没有可渲染的图形或引脚");
  return {name,shapes,pins,skipped};
}

    g.appendChild(el);}
  for(const p of sym.pins){
    const r=p.angle*Math.PI/180,ex=p.x+p.length*Math.cos(r),ey=p.y+p.length*Math.sin(r);
    const sel=selPin!=null&&String(selPin)===String(p.number);
    const col=sel?"#006cff":SK;
    const pg=mk("g",{style:"cursor:pointer"});
    pg.appendChild(mk("line",{x1:p.x,y1:-p.y,x2:ex,y2:-ey,stroke:"transparent","stroke-width":1.2}));
    pg.appendChild(mk("line",{x1:p.x,y1:-p.y,x2:ex,y2:-ey,stroke:col,"stroke-width":sel?W*3:W}));
    pg.appendChild(mk("circle",{cx:p.x,cy:-p.y,r:.35,fill:col}));
    if(onPinClick&&p.number)pg.addEventListener("click",e=>{e.stopPropagation();onPinClick(p.number)});
    g.appendChild(pg);
    const inX=Math.cos(r),inY=-Math.sin(r),vert=Math.abs(inY)>Math.abs(inX);
    if(p.number){
      const mx=(p.x+ex)/2,my=-(p.y+ey)/2;
      const t=vert?mk("text",{x:mx-.35,y:my,"font-size":1,"text-anchor":"middle",fill:sel?"#006cff":"#7a8a80",
        transform:`rotate(-90 ${mx-.35} ${my})`}):mk("text",{x:mx,y:my-.45,"font-size":1,"text-anchor":"middle",fill:sel?"#006cff":"#7a8a80"});
      t.textContent=p.number;g.appendChild(t);}
    if(p.name&&p.name!=="~"){
      const nx=ex+inX*.8,ny=-ey+inY*.8;
      const anchor=vert?(inY>0?"end":"start"):(inX>0?"start":"end");
      const t=vert?mk("text",{x:nx,y:ny+.4,"font-size":1.15,"text-anchor":anchor,fill:sel?"#006cff":"#1a2e23",
        transform:`rotate(-90 ${nx} ${ny+.4})`}):mk("text",{x:nx,y:ny+.4,"font-size":1.15,"text-anchor":anchor,fill:sel?"#006cff":"#1a2e23"});
      t.textContent=p.name;g.appendChild(t);}}
  return sym.pins.length;
}

// ── 3D 等轴测示意（ezPLM 提供 STEP，浏览器无法直接渲染）──
function Model3DSVG({pkg,svgRef}){
  const g=parsePackage(pkg);
  if(!g)return <EmptyPreview text="无封装信息"/>;
  const W=760,H=480,cx=W/2,cy=H/2+20;
  const s=Math.min(200/Math.max(g.bodyW,1),200/Math.max(g.bodyH,1))*1.1;
  const w=g.bodyW*s,d=g.bodyH*s,h=Math.max(26,w*0.16);
  const ox=d*0.45,oy=d*0.26;
  const top=`${cx-w/2},${cy-h} ${cx-w/2+ox},${cy-h-oy} ${cx+w/2+ox},${cy-h-oy} ${cx+w/2},${cy-h}`;
  const right=`${cx+w/2},${cy-h} ${cx+w/2+ox},${cy-h-oy} ${cx+w/2+ox},${cy-oy} ${cx+w/2},${cy}`;
  // 引脚示意
  const leads=[];
  const per=Math.max(1,Math.ceil(g.pins/(g.type==="qfn"||g.type==="qfp"?4:2)));
  if(g.type!=="chip"&&g.type!=="bga"){
    for(let i=0;i<per;i++){
      const t=per===1?0.5:i/(per-1);
      const y=cy-h*0.35-oy*t*0.8, xl=cx-w/2, xr=cx+w/2;
      const ly=cy-h*0.2+ (d*0.5)*(t-0.5);
      leads.push(<rect key={`l${i}`} x={xl-14} y={ly} width={14} height={5} fill="#c7ccd2" rx={1}/>);
      leads.push(<rect key={`r${i}`} x={xr} y={ly-oy*0.15} width={14} height={5} fill="#c7ccd2" rx={1}/>);
    }
  }
  return(<svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:340,background:"linear-gradient(160deg,#f7faf8,#eef3f0)",borderRadius:8,border:`1px solid ${C.borderLight}`}}>
    <defs><linearGradient id="topg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#4a6357"/><stop offset="100%" stopColor="#33463d"/></linearGradient></defs>
    {[...Array(9)].map((_,i)=>(<line key={`gx${i}`} x1={cx-260+i*65} y1={cy+40} x2={cx-200+i*65} y2={cy+8} stroke="#dde5e0" strokeWidth="1"/>))}
    <ellipse cx={cx+ox*0.5} cy={cy+10} rx={w*0.66} ry={10} fill="#00000015"/>
    {leads}
    <rect x={cx-w/2} y={cy-h} width={w} height={h} fill="#2c3e35"/>
    <polygon points={top} fill="url(#topg)"/>
    <polygon points={right} fill="#1f2d26"/>
    <circle cx={cx-w/2+16} cy={cy-h/2} r={4.5} fill="#8fd6b4"/>
    <text x={cx+ox*0.5} y={H-18} textAnchor="middle" fontSize={13} fill="#6b8578" fontFamily="'DM Mono',monospace">
      {g.label} · {g.bodyW}×{g.bodyH}mm · {g.pins}pin</text>
  </svg>);
}

// ── SVG 缩放/平移视口（移植自 kicad-part-viewer）──
function attachViewport(svg){
  if(!svg||svg._vpBound)return svg?._vp;
  const base={x:0,y:0,w:800,h:520};
  let view={...base},dragging=false,pid=null,last={x:0,y:0},down={x:0,y:0},moved=false;
  const apply=()=>svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
  const reset=()=>{view={...base};apply()};
  const zoomAt=(f,clientX,clientY)=>{
    const r=svg.getBoundingClientRect();if(!r.width||!r.height)return;
    const px=clientX==null?r.left+r.width/2:clientX, py=clientY==null?r.top+r.height/2:clientY;
    const ux=view.x+(px-r.left)/r.width*view.w, uy=view.y+(py-r.top)/r.height*view.h;
    const nw=Math.min(base.w*8,Math.max(base.w/20,view.w*f)), nh=nw*(base.h/base.w);
    const rx=(ux-view.x)/view.w, ry=(uy-view.y)/view.h;
    view={x:ux-rx*nw,y:uy-ry*nh,w:nw,h:nh};apply();
  };
  svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY>0?1.12:.89,e.clientX,e.clientY)},{passive:false});
  svg.addEventListener("pointerdown",e=>{if(e.button!==0)return;dragging=true;moved=false;pid=e.pointerId;
    down={x:e.clientX,y:e.clientY};last={...down};svg.setPointerCapture(pid);svg.style.cursor="grabbing"});
  svg.addEventListener("pointermove",e=>{if(!dragging||e.pointerId!==pid)return;
    if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)moved=true;
    const r=svg.getBoundingClientRect();
    view.x-=(e.clientX-last.x)/r.width*view.w;view.y-=(e.clientY-last.y)/r.height*view.h;
    last={x:e.clientX,y:e.clientY};apply()});
  const stop=()=>{if(!dragging)return;dragging=false;try{svg.releasePointerCapture(pid)}catch{}pid=null;svg.style.cursor="grab"};
  svg.addEventListener("pointerup",stop);svg.addEventListener("pointercancel",stop);
  svg.addEventListener("dblclick",reset);
  svg.style.cursor="grab";svg.style.touchAction="none";
  apply();
  svg._vpBound=true;svg._vp={reset,zoomIn:()=>zoomAt(.78),zoomOut:()=>zoomAt(1.28)};
  return svg._vp;
}


// ═══════════════════════════════════════════════════════════
// STEP 3D 在线预览（移植自 ezplm-smt-scm）
// occt-import-js(OCCT WASM 内核) 解析 STEP → three.js 渲染
// 手动触发：内核约 7.6MB + STEP 文件本身 1-3MB，不应随页面自动加载
// ═══════════════════════════════════════════════════════════
const OCCT_CDN="https://esm.sh/occt-import-js@0.0.23";
const THREE_CDN="https://esm.sh/three@0.185.0";
const ORBIT_CDN="https://esm.sh/three@0.185.0/examples/jsm/controls/OrbitControls.js";

function Step3DViewer({stepUrl,fileName}){
  const[phase,setPhase]=useState("idle");   // idle|loading|ready|error
  const[msg,setMsg]=useState("");
  const[meshCount,setMeshCount]=useState(0);
  const hostRef=useRef(null);
  const disposeRef=useRef(null);
  useEffect(()=>()=>disposeRef.current?.(),[]);

  async function load(){
    setPhase("loading");setMsg("正在加载 3D 内核与 STEP 模型…");
    try{
      const [occtMod,THREE,orbitMod]=await Promise.all([
        import(/* webpackIgnore: true */ OCCT_CDN),
        import(/* webpackIgnore: true */ THREE_CDN),
        import(/* webpackIgnore: true */ ORBIT_CDN),
      ]);
      const occtFactory=occtMod.default||occtMod;
      const OrbitControls=orbitMod.OrbitControls;
      setMsg("正在初始化 OCCT 内核…");
      const occt=await occtFactory();

      setMsg("正在下载 STEP 文件…");
      const res=await fetch(proxyRes(stepUrl));
      if(!res.ok){
        const b=await res.json().catch(()=>null);
        throw new Error(b?.error||`拉取 STEP 文件失败 (HTTP ${res.status})`);
      }
      const bytes=new Uint8Array(await res.arrayBuffer());

      setMsg("正在解析几何…");
      const result=occt.ReadStepFile(bytes,null);
      if(!result?.success||!result.meshes?.length)throw new Error("STEP 解析成功但没有可显示的网格");

      const host=hostRef.current;
      if(!host)throw new Error("渲染容器不可用");
      host.innerHTML="";
      const width=host.clientWidth||600,height=380;
      const scene=new THREE.Scene();
      scene.background=new THREE.Color(0xf7faf8);
      const group=new THREE.Group();
      for(const mesh of result.meshes){
        const geo=new THREE.BufferGeometry();
        geo.setAttribute("position",new THREE.Float32BufferAttribute(mesh.attributes.position.array,3));
        if(mesh.attributes.normal)geo.setAttribute("normal",new THREE.Float32BufferAttribute(mesh.attributes.normal.array,3));
        else geo.computeVertexNormals();
        if(mesh.index)geo.setIndex(mesh.index.array);
        const color=mesh.color?new THREE.Color(mesh.color[0],mesh.color[1],mesh.color[2]):new THREE.Color(0x8a8f98);
        group.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,metalness:.25,roughness:.6})));
      }
      const box=new THREE.Box3().setFromObject(group);
      const center=box.getCenter(new THREE.Vector3());
      const size=box.getSize(new THREE.Vector3()).length()||10;
      group.position.sub(center);
      scene.add(group);
      scene.add(new THREE.AmbientLight(0xffffff,.75));
      const dir=new THREE.DirectionalLight(0xffffff,1.1);dir.position.set(1,1.4,1);scene.add(dir);
      const camera=new THREE.PerspectiveCamera(45,width/height,size/500,size*20);
      camera.position.set(size*.7,size*.6,size*.9);
      const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
      renderer.setSize(width,height);
      host.appendChild(renderer.domElement);
      const controls=new OrbitControls(camera,renderer.domElement);
      controls.enableDamping=true;
      let raf=0;
      const tick=()=>{raf=requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)};
      tick();
      const onResize=()=>{const w=host.clientWidth||width;camera.aspect=w/height;camera.updateProjectionMatrix();renderer.setSize(w,height)};
      window.addEventListener("resize",onResize);
      disposeRef.current=()=>{cancelAnimationFrame(raf);window.removeEventListener("resize",onResize);
        controls.dispose();renderer.dispose();host.innerHTML="";};
      setMeshCount(result.meshes.length);setPhase("ready");
    }catch(e){
      setPhase("error");
      setMsg(e instanceof Error?e.message:String(e));
    }
  }

  return(<div>
    <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:10}}>
      {(phase==="idle"||phase==="error")&&(
        <button onClick={load} style={{padding:"9px 18px",borderRadius:8,border:"none",background:C.green,color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"}}>
          {phase==="error"?"重试加载 3D 模型":"▶ 加载 3D 模型"}
        </button>)}
      <a href={proxyRes(stepUrl)} target="_blank" rel="noreferrer" download
        style={{padding:"8px 14px",borderRadius:8,border:`1px solid ${C.border}`,background:"#fff",color:C.textSec,fontSize:12,textDecoration:"none"}}>
        ⬇ 下载 STEP 源文件
      </a>
      <span style={{fontSize:11,color:C.textMute,flex:1,minWidth:200}}>
        {fileName?`${fileName} · `:""}需下载约 7.6MB 的 3D 内核与 STEP 文件，故手动触发。
      </span>
    </div>
    {phase==="loading"&&<div style={{padding:"40px",textAlign:"center",color:C.textMute}}>
      <div style={{width:28,height:28,border:`3px solid ${C.borderLight}`,borderTopColor:C.green,borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 10px"}}/>
      <div style={{fontSize:12}}>{msg}</div></div>}
    {phase==="error"&&<div style={{padding:"12px 14px",borderRadius:8,background:"#fdeaea",border:"1px solid #f5c6c6",color:"#a0302a",fontSize:12}}>
      3D 预览失败：{msg}。可下载 STEP 源文件用 KiCad / FreeCAD 打开。</div>}
    {phase==="ready"&&<div style={{fontSize:11,color:C.textMute,marginBottom:6}}>
      已渲染 {meshCount} 个网格 · 左键旋转 / 滚轮缩放 / 右键平移</div>}
    <div ref={hostRef} style={{borderRadius:8,overflow:"hidden",
      border:phase==="ready"?`1px solid ${C.borderLight}`:"none",minHeight:phase==="ready"?0:undefined}}/>
  </div>);
}

// ═══ 图形预览面板：符号 / 封装 / 3D（真实 KiCad 文件优先）═══
function GraphicsPanel({d,pn}){
  const[g,setG]=useState("footprint");
  const[fpText,setFpText]=useState(null);      // kicad_mod 文本
  const[symText,setSymText]=useState(null);    // 符号 legacy 文本
  const[fpReal,setFpReal]=useState(false);
  const[symReal,setSymReal]=useState(false);
  const[ksym,setKSym]=useState(null);
  const[kskip,setKSkip]=useState(0);
  const[loading,setLoading]=useState(true);
  const[pin,setPin]=useState(null);            // 选中引脚（符号↔封装联动）
  const fpRef=useRef(null),symRef=useRef(null),m3Ref=useRef(null);
  const pkg=d?.footprint||(d?.parameters||[]).find(p=>/封装|package/i.test(p.name))?.value;

  // 拉取真实 KiCad 文件（经代理），失败则合成
  useEffect(()=>{
    let dead=false;
    (async()=>{
      setLoading(true);setPin(null);
      // 封装
      let ft=null,real=false;
      if(d?.footprintFileUrl){
        try{
          const r=await fetch(proxyRes(d.footprintFileUrl));
          if(r.ok){const t=await r.text();if(t.includes("(pad")||t.includes("(fp_")){ft=t;real=true;}}
        }catch(e){}
      }
      if(!ft)ft=synthKicadMod(pkg);
      if(dead)return;
      setFpText(ft);setFpReal(real);
      // 符号
      let st=null,sreal=false,ksym=null,kskip=0;
      if(d?.symbolUrl){
        try{
          const r=await fetch(proxyRes(d.symbolUrl));
          if(r.ok){
            const raw=await r.text();
            if(raw.includes("(kicad_symbol_lib")){
              try{const ps=parseKicadSym(raw);ksym=ps;kskip=ps.skipped;sreal=true;}catch(e){}
            }
            if(!ksym){
              const conv=extractLegacySymbol(raw,pn)||modernSymbolToLegacy(raw,pn)||extractLegacySymbol(raw,d?.partNumber);
              if(conv){st=conv;sreal=true;}
            }
          }
        }catch(e){}
      }
      if(!st){
        const gp=parsePackage(pkg);
        // 若 ezPLM 参数里带引脚定义则用之，否则留空
        const pinAttr=(d?.parameters||[]).find(x=>/引脚定义|pinout|pin\s*name/i.test(x.name));
        const names=pinAttr?String(pinAttr.value).split(/[,，;；]/).map(t=>t.trim()):null;
        st=genericSymbol(pn,gp?.pins||8,names);
      }
      if(dead)return;
      setSymText(st);setSymReal(sreal);setKSym(ksym);setKSkip(kskip);setLoading(false);
    })();
    return()=>{dead=true};
  },[d,pn,pkg]);

  // 渲染到 SVG
  useEffect(()=>{
    if(g==="footprint"&&fpRef.current&&fpText){renderFootprintToSvg(fpText,fpRef.current,setPin,pin);attachViewport(fpRef.current);}
  },[g,fpText,pin]);
  useEffect(()=>{
    if(g!=="symbol"||!symRef.current)return;
    if(ksym){renderKicadSymTo(ksym,symRef.current,setPin,pin);}
    else if(symText){renderSymbolToSvg(symText,symRef.current,1,setPin,pin);}
    attachViewport(symRef.current);
  },[g,symText,ksym,pin]);
  useEffect(()=>{
    if(g==="model3d"&&m3Ref.current)attachViewport(m3Ref.current);
  },[g]);
  const vp=()=>g==="footprint"?fpRef.current?._vp:g==="symbol"?symRef.current?._vp:m3Ref.current?._vp;

  const dl=(d?.downloads||[]).find(f=>f.type===(g==="model3d"?"model3d":g));
  const srcTag=(real,realLabel)=>(real
    ?<span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:C.greenLight,color:C.green,border:`1px solid ${C.greenMid}`}}>
       ✓ {realLabel} · 由本系统解析绘制，字体与隐藏属性等细节可能与 KiCad 显示存在差异，以源文件为准</span>
    :<span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:C.amberBg,color:C.amber,border:"1px solid #f0dca0"}}>
       ⚠ 示意渲染 · ezPLM 未提供该资源，此图依封装名推算生成，非精确制造数据</span>);

  return(<div>
    <div style={{display:"flex",gap:6,marginBottom:12,justifyContent:"center"}}>
      {[["symbol","🔣 原理图符号"],["footprint","📐 PCB 封装"],["model3d","🧊 3D 模型"]].map(([k,l])=>(
        <button key={k} onClick={()=>setG(k)}
          style={{padding:"7px 16px",borderRadius:7,borderWidth:1.5,borderStyle:"solid",
            borderColor:g===k?C.green:C.border,background:g===k?C.greenLight:"#fff",
            color:g===k?C.green:C.textSec,fontSize:13,fontWeight:g===k?600:400,cursor:"pointer"}}>{l}</button>))}
    </div>

    {loading&&<div style={{padding:"50px",textAlign:"center",color:C.textMute}}>
      <div style={{width:28,height:28,border:`3px solid ${C.borderLight}`,borderTopColor:C.green,borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 10px"}}/>
      正在加载 KiCad 库文件…</div>}

    {!loading&&(<div>
      <div style={{textAlign:"center",marginBottom:8}}>
        {g==="footprint"&&srcTag(fpReal,"真实 KiCad 封装文件")}
        {g==="symbol"&&srcTag(symReal,"真实 KiCad 符号文件")}
        {g==="model3d"&&!d?.model3dUrl&&srcTag(false,"")}
      </div>

      <div style={{position:"relative"}}>
        <div style={{position:"absolute",right:10,top:10,zIndex:5,display:(g==="model3d"&&d?.model3dUrl)?"none":"flex",gap:5}}>
          <button onClick={()=>vp()?.zoomIn()} title="放大" style={VP_BTN}>＋</button>
          <button onClick={()=>vp()?.zoomOut()} title="缩小" style={VP_BTN}>－</button>
          <button onClick={()=>vp()?.reset()} title="复位" style={{...VP_BTN,width:"auto",padding:"0 10px",fontSize:11}}>复位</button>
        </div>
        {g==="footprint"&&<svg ref={fpRef} viewBox="0 0 800 520" style={{width:"100%",height:340,background:"#fff",borderRadius:8,border:`1px solid ${C.borderLight}`}}/>}
        {g==="symbol"&&<svg ref={symRef} viewBox="0 0 800 520" style={{width:"100%",height:340,background:"#fffdf5",borderRadius:8,border:`1px solid ${C.borderLight}`}}/>}
        {g==="model3d"&&(d?.model3dUrl
          ?<Step3DViewer stepUrl={d.model3dUrl} fileName={d.model3dFileName}/>
          :<Model3DSVG pkg={pkg} svgRef={m3Ref}/>)}
        {!(g==="model3d"&&d?.model3dUrl)&&<div style={{position:"absolute",left:12,bottom:10,fontSize:10,color:C.textMute,background:"rgba(255,255,255,.85)",padding:"3px 7px",borderRadius:4,pointerEvents:"none"}}>
          滚轮缩放 · 拖拽平移 · 双击复位</div>}
      </div>

      {g==="symbol"&&kskip>0&&<div style={{textAlign:"center",fontSize:11,color:C.amber,marginTop:6}}>
        ⚠ 有 {kskip} 个图元未能识别而未渲染，符号可能不完整</div>}
      {(g==="footprint"||g==="symbol")&&<div style={{textAlign:"center",fontSize:11,color:C.textMute,marginTop:6}}>
        💡 点击引脚或焊盘可高亮对应位置{pin!=null?` · 当前选中 Pin ${pin}`:""}
        {pin!=null&&<button onClick={()=>setPin(null)} style={{marginLeft:8,padding:"1px 8px",borderRadius:4,border:`1px solid ${C.border}`,background:"#fff",fontSize:11,cursor:"pointer"}}>清除</button>}
      </div>}

      {g==="model3d"&&d?.model3dUrl&&<div style={{textAlign:"center",fontSize:11,color:C.textMute,marginTop:6}}>
        ezPLM 提供 STEP 格式模型（浏览器无法直接渲染），可下载后用 KiCad/FreeCAD 打开
      </div>}

      {(dl||d?.footprintFileUrl||d?.model3dUrl)&&(<div style={{display:"flex",justifyContent:"center",marginTop:12}}>
        <a href={proxyRes(dl?.url||(g==="footprint"?d?.footprintFileUrl:g==="model3d"?d?.model3dUrl:d?.symbolUrl))}
          target="_blank" rel="noreferrer" download
          style={{padding:"9px 20px",borderRadius:8,background:C.green,color:"#fff",fontSize:13,fontWeight:600,textDecoration:"none",
            display:(g==="footprint"&&d?.footprintFileUrl)||(g==="model3d"&&d?.model3dUrl)||(g==="symbol"&&d?.symbolUrl)?"inline-block":"none"}}>

// ═══ 左栏：参数行（可拖拽 + 点击设约束）═══
function ParamRow({p,index,con,onSetCon,onDragStart,onDragOver,onDrop,dragging}){
  const[open,setOpen]=useState(false);
  const[type,setType]=useState(con?.constraintType||"none");
  const[min,setMin]=useState(con?.min??"");
  const[max,setMax]=useState(con?.max??"");
  const save=()=>{
    if(type==="none")onSetCon(p.id,null);
    else onSetCon(p.id,{constraintType:type,min:min===""?null:min,max:max===""?null:max});
    setOpen(false);
  };
  const hasCon=con&&con.constraintType;
  return(<div draggable onDragStart={e=>onDragStart(e,index)} onDragOver={e=>onDragOver(e,index)} onDrop={e=>onDrop(e,index)}
    style={{borderRadius:8,border:`1.5px solid ${hasCon?(con.constraintType==="hard"?"#c0392b60":C.amber+"80"):C.borderLight}`,background:"#fff",marginBottom:6,cursor:"grab",opacity:dragging===index?0.4:1}}>
    <div onClick={()=>setOpen(!open)} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 10px",cursor:"pointer"}}>
      <span style={{minWidth:24,height:24,borderRadius:5,background:C.greenLight,color:C.green,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,fontFamily:"'DM Mono',monospace",border:`1px solid ${C.greenMid}`}}>{index+1}</span>
      <span style={{color:C.textMute,fontSize:13,cursor:"grab"}}>⣿</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:600}}>{p.name}{hasCon&&<span style={{marginLeft:6,fontSize:10,padding:"1px 5px",borderRadius:3,background:con.constraintType==="hard"?"#fdeaea":C.amberBg,color:con.constraintType==="hard"?"#c0392b":C.amber}}>{con.constraintType==="hard"?"硬约束":"软偏好"}</span>}</div>
        <div style={{fontSize:11,color:C.textMute}}>{p.nameEn}</div>
      </div>
      <span style={{fontSize:12,fontFamily:"'DM Mono',monospace",color:C.textSec,whiteSpace:"nowrap"}}>{p.value}{p.unit?` ${p.unit}`:""}</span>
      <span style={{fontSize:10,color:C.textMute}}>▾</span>
    </div>
    {open&&(<div style={{padding:"8px 12px 10px",borderTop:`1px dashed ${C.borderLight}`,background:C.bgSoft}}>
      <div style={{display:"flex",gap:6,marginBottom:8}}>
        {[["none","无约束"],["hard","硬约束(不满足即淘汰)"],["soft","软偏好(不满足扣分)"]].map(([v,l])=>(
          <button key={v} onClick={()=>setType(v)} style={{padding:"4px 10px",borderRadius:5,borderWidth:1,borderStyle:"solid",borderColor:type===v?C.green:C.border,background:type===v?C.greenLight:"#fff",fontSize:11,cursor:"pointer"}}>{l}</button>))}
      </div>
      {type!=="none"&&(<div style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
        <span style={{fontSize:12,color:C.textSec}}>范围:</span>
        <input value={min} onChange={e=>setMin(e.target.value)} placeholder="最小值" style={{width:90,padding:"5px 8px",borderRadius:5,border:`1px solid ${C.border}`,fontSize:12,fontFamily:"'DM Mono',monospace"}}/>
        <span style={{color:C.textMute}}>~</span>
        <input value={max} onChange={e=>setMax(e.target.value)} placeholder="最大值" style={{width:90,padding:"5px 8px",borderRadius:5,border:`1px solid ${C.border}`,fontSize:12,fontFamily:"'DM Mono',monospace"}}/>
        <span style={{fontSize:11,color:C.textMute}}>{p.unit}</span>
      </div>)}
      <button onClick={save} style={{padding:"5px 16px",borderRadius:5,border:"none",background:C.green,color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>确定</button>
    </div>)}
  </div>);
}

function MarketStrip({rec,market}){
  const m=rec.market||market?.[rec.partNumber];
  if(!m||m.source==="unavailable")return null;
  const stockColor={"有货":C.green,"充足":C.green,"一般":C.amber,"紧张":"#c2610c","缺货":"#c0392b","停产风险":"#c0392b"}[m.stock]||C.textMute;
  const d=rec.costDelta, dp=rec.costDeltaPct;
  const cheaper=d!=null&&d<0;
  return(<div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",padding:"8px 10px",borderRadius:7,background:C.bgSoft,border:`1px solid ${C.borderLight}`,fontSize:12}}>
    <span style={{fontWeight:600,color:C.textSec}}>💰</span>
    {m.priceUSD1!=null&&<span style={{fontFamily:"'DM Mono',monospace"}}>1片 <b style={{color:C.green}}>${m.priceUSD1}</b></span>}
    {m.priceUSD100!=null&&<span style={{fontFamily:"'DM Mono',monospace"}}>100片 <b style={{color:C.green}}>${m.priceUSD100}</b></span>}
    {d!=null&&(<span style={{padding:"2px 8px",borderRadius:4,fontWeight:700,fontFamily:"'DM Mono',monospace",
      background:cheaper?C.greenLight:"#fdeaea",color:cheaper?C.green:"#c0392b",border:`1px solid ${cheaper?C.greenMid:"#f5c6c6"}`}}>
      {cheaper?"↓省":"↑贵"} ${Math.abs(d).toFixed(2)}{dp!=null?` (${dp>0?"+":""}${dp}%)`:""}
    </span>)}
    <span>供货 <b style={{color:stockColor}}>{m.stock}</b>{m.stockQty?` ${m.stockQty.toLocaleString()}`:""}</span>
    {m.channels?.length>0&&<span style={{color:C.textMute}}>{m.channels.join("、")}</span>}

      {m.source==="distributor_api"?"实时报价 ✓":"AI估算 ⚠"}</span>
  </div>);
}

            style={{fontSize:18,fontWeight:700,fontFamily:"'DM Mono',monospace",color:C.green,cursor:"pointer",textDecoration:"underline dotted",textUnderlineOffset:3}}
            title="点击查看详情和供应商采购信息">{rec.partNumber} 🔍</span>
          {rec.isPreferred&&<span style={{padding:"2px 7px",borderRadius:4,background:C.amberBg,color:C.amber,fontSize:11,fontWeight:600,border:"1px solid #f0dca0"}}>⭐ 优选</span>}
          {rec.inPLM&&<span style={{padding:"2px 7px",borderRadius:4,background:C.indigoBg,color:C.indigo,fontSize:11,fontWeight:600,border:`1px solid ${C.indigoBorder}`}}>📦 ezPLM</span>}
          <span style={{padding:"2px 7px",borderRadius:4,background:C.bgSoft,color:C.textMute,fontSize:10,border:`1px solid ${C.borderLight}`}}>{rec.dataSource}</span>
        </div>
        <div style={{fontSize:13,color:C.textMute}}>{rec.manufacturer}</div>
        {rec.description&&<div style={{fontSize:12,color:C.textMute,marginTop:2}}>{rec.description}</div>}
      </div>
      <div style={{fontSize:16,color:C.textMute,transform:expanded?"rotate(180deg)":"rotate(0)",transition:"transform 0.2s"}}>▾</div>
    </div>
    {(rec.technical!=null)&&(<div style={{padding:"0 18px 10px"}}>
      <div style={{display:"flex",gap:8}}>
        {[["技术兼容",rec.technical],["证据覆盖",rec.evidenceCoverage!=null?rec.evidenceCoverage+"%":"—"],["来源可信",rec.sourceConfidence!=null?rec.sourceConfidence+"%":"—"],["结论可信",rec.confidence]].map(([l,v],i)=>(
          <div key={i} style={{flex:1,padding:"7px 8px",borderRadius:7,background:i===3?C.greenLight:C.bgSoft,border:`1px solid ${i===3?C.greenMid:C.borderLight}`,textAlign:"center"}}>
            <div style={{fontSize:16,fontWeight:700,fontFamily:"'DM Mono',monospace",color:i===3?C.green:C.text}}>{v}</div>
            <div style={{fontSize:10,color:C.textMute,marginTop:1}}>{l}</div>
          </div>))}
      </div>
      {rec.replacementLevel?.level==="P2"&&<div style={{marginTop:6,fontSize:11,color:"#854f0b",background:C.amberBg,border:"1px solid #f0dca0",borderRadius:6,padding:"5px 8px"}}>⚠ 参数高度匹配，但引脚映射尚未验证 — 需人工核对引脚后方可判定"可直接替换"</div>}
      {rec.replacementLevel?.level==="P0"&&<div style={{marginTop:6,fontSize:11,color:"#7a5b00",background:"#f5f0e0",border:"1px solid #e0d4a0",borderRadius:6,padding:"5px 8px"}}>ℹ 证据覆盖率过低，数据不足以判断兼容性</div>}
      <div style={{marginTop:8}}><MarketStrip rec={rec} market={market}/></div>
    </div>)}
    {expanded&&(rec.paramScores||[]).length>0&&(<div style={{padding:"0 14px 12px"}}>
      <div style={{padding:"6px 10px",fontSize:12,fontWeight:600,color:C.text}}>🔬 参数对比详情</div>
      {rec.paramScores.map(ps=>(
        <div key={ps.paramId} style={{display:"grid",gridTemplateColumns:"110px 1fr 40px 120px auto",gap:8,alignItems:"center",padding:"6px 10px",borderRadius:6,background:ps.known===false?"#f5f5f5":scoreBg(ps.score),fontSize:12,marginBottom:3}}>
          <div style={{color:C.textSec,fontSize:11}}>{ps.paramName}</div>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:12}}>{ps.value}{ps.unit&&!String(ps.value).includes(ps.unit)?` ${ps.unit}`:""}</div>
          <div style={{fontWeight:700,color:ps.known===false?C.textMute:scoreColor(ps.score),fontFamily:"'DM Mono',monospace",textAlign:"center"}}>{ps.known===false?"—":ps.score}</div>
          <div style={{color:C.textMute,fontSize:11}}>{ps.comment}</div>
          <div style={{textAlign:"right"}}><SourceTag source={ps.source} sourceLabel={ps.sourceLabel}/></div>
        </div>))}
    </div>)}
  </div>);
}

// ═══ 对比表视图 ═══
function CompareTable({original,recs}){
  const params=original.parameters||[];
  return(<div style={{overflowX:"auto",borderRadius:10,border:`1.5px solid ${C.border}`,background:"#fff"}}>
    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:640}}>
      <thead><tr style={{background:C.greenLight}}>
        <th style={{padding:"9px 12px",textAlign:"left",fontSize:12,color:C.green,borderBottom:`1px solid ${C.greenMid}`,position:"sticky",left:0,background:C.greenLight}}>参数</th>
        <th style={{padding:"9px 12px",textAlign:"left",fontSize:12,color:C.textSec,borderBottom:`1px solid ${C.greenMid}`}}>{original.partNumber}<div style={{fontSize:10,fontWeight:400}}>原型号</div></th>
        {recs.map(r=><th key={r.partNumber} style={{padding:"9px 12px",textAlign:"left",fontSize:12,color:C.green,borderBottom:`1px solid ${C.greenMid}`}}>{r.partNumber}<div style={{fontSize:10,fontWeight:400,color:scoreColor(r.confidence)}}>可信{r.confidence}</div></th>)}
      </tr></thead>
      <tbody>{params.map((p,i)=>(<tr key={p.id} style={i%2?{background:C.bgSoft}:{}}>
        <td style={{padding:"7px 12px",fontWeight:600,fontSize:11,color:C.textSec,position:"sticky",left:0,background:i%2?C.bgSoft:"#fff"}}>{p.name}</td>
        <td style={{padding:"7px 12px",fontFamily:"'DM Mono',monospace",fontSize:11}}>{p.value}{p.unit?` ${p.unit}`:""}</td>
        {recs.map(r=>{const ps=(r.paramScores||[]).find(x=>x.paramId===p.id);
          return<td key={r.partNumber} style={{padding:"7px 12px",fontFamily:"'DM Mono',monospace",fontSize:11,background:ps?(ps.known===false?"#f5f5f5":scoreBg(ps.score)):undefined}}>
            {ps?`${ps.value}${ps.unit&&!String(ps.value).includes(ps.unit)?" "+ps.unit:""}`:"—"}
            {ps&&ps.known!==false&&<span style={{marginLeft:6,fontWeight:700,color:scoreColor(ps.score)}}>{ps.score}</span>}
          </td>;})}
      </tr>))}</tbody>
    </table>
  </div>);
}

// ═══ 工作台（双栏）═══
function Workbench({original,demoNote,onBack,onSwitchVariant}){
  const isNAv=v=>v==null||/^n\/?a$/i.test(String(v).trim());
  const[params,setParams]=useState((original.parameters||[]).filter(p=>!isNAv(p.value)).slice(0,10));
  const[constraints,setConstraints]=useState({});
  const[mfrs,setMfrs]=useState([]);
  const[mfrInput,setMfrInput]=useState("");
  const[mode,setMode]=useState("funcCompat");
  const[application,setApplication]=useState("generic");
  const[showVariants,setShowVariants]=useState(false);
  const[phase,setPhase]=useState("idle"); // idle|loading|done
  const[result,setResult]=useState(null);
  const[note,setNote]=useState(demoNote||"");
  const[view,setView]=useState("cards");
  const[detailPN,setDetailPN]=useState(null);
  const[detailRec,setDetailRec]=useState(null);
  const onShowSelf=()=>{setDetailPN(original.partNumber);setDetailRec({manufacturer:original.manufacturer});};
  const[market,setMarket]=useState(null);   // {PN: {priceUSD1,stock,channels,source}}
  const[dragging,setDragging]=useState(null);
  const dragFrom=useRef(null);

  const onDragStart=(e,i)=>{dragFrom.current=i;setDragging(i);};
  const onDragOver=(e,i)=>{e.preventDefault();};
  const onDrop=(e,i)=>{
    e.preventDefault();
    const from=dragFrom.current;
    if(from==null||from===i)return void setDragging(null);
    const next=[...params];const[m]=next.splice(from,1);next.splice(i,0,m);
    setParams(next);setDragging(null);dragFrom.current=null;
  };
  const setCon=(pid,c)=>setConstraints(prev=>{const n={...prev};if(c)n[pid]=c;else delete n[pid];return n;});
  const addMfr=()=>{const v=mfrInput.trim();if(v&&!mfrs.includes(v)){setMfrs([...mfrs,v]);}setMfrInput("");};
  const mfrSuggest=mfrInput?POPULAR_MFRS.filter(m=>m.toLowerCase().includes(mfrInput.toLowerCase())&&!mfrs.includes(m)).slice(0,5):[];

  const fetchMarket=async(pns)=>{
    setMarket(null);
    try{
      const r=await fetch("/api/v2/market",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({partNumbers:pns})});
      const d=await r.json().catch(()=>null);
      if(d&&d.success)setMarket(d.parts||{});
      else setMarket({});
    }catch(e){setMarket({});}
  };

  const runRecommend=async()=>{
    setPhase("loading");setNote("");
    try{
      const r=await fetch("/api/v2/recommend",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({partNumber:original.partNumber,mode,application,preferredManufacturers:mfrs,constraints,
          priorityOrder:params.map(p=>p.id),original:original._dataPath==="demo"?undefined:original})});
      const d=await r.json().catch(()=>null);
      if(d&&d.success&&d.recommendations?.length){
        setResult(d);setPhase("done");
      }else if(original.partNumber==="STM32F103C8T6"&&original._dataPath==="demo"){
        setResult({recommendations:MOCK_RECS,eliminated:[]});
        setNote("演示模式数据");setPhase("done");
      }else{
        setNote(d&&d.success===false?`推荐失败：${d.error||"未知错误"}，请点击按钮重试`:"推荐失败，请稍后重试");
        setPhase("idle");
      }
    }catch(e){
      setNote("网络错误或超时，请点击按钮重试");setPhase("idle");
    }
  };

  const exportMD=()=>{
    if(!result)return;
    let md=`# ${original.partNumber} 替代料推荐\n\n| # | 型号 | 厂商 | 等级 | 结论可信度 |\n|---|------|------|------|------|\n`;
    result.recommendations.forEach((r,i)=>{md+=`| ${i+1} | ${r.partNumber} | ${r.manufacturer} | ${r.replacementLevel.level} ${r.replacementLevel.label} | ${r.confidence??r.overallScore} |\n`;});
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+md],{type:"text/markdown"}));a.download=`${original.partNumber}_替代推荐.md`;a.click();
  };
  const exportCSV=()=>{
    if(!result)return;
    let csv="\uFEFF型号,厂商,等级,技术兼容,证据覆盖,来源可信,结论可信\n";
    result.recommendations.forEach(r=>{csv+=`${r.partNumber},${r.manufacturer},${r.replacementLevel.level},${r.technical??""},${r.evidenceCoverage??""},${r.sourceConfidence??""},${r.confidence??r.overallScore}\n`;});
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`${original.partNumber}_替代推荐.csv`;a.click();
  };

  return(<div className="workbench" style={{maxWidth:1400,margin:"16px auto",padding:"0 20px",display:"grid",gridTemplateColumns:"400px 1fr",gap:18,alignItems:"start"}}>
    {/* ══ 左栏 ══ */}
    <div>
      <div style={{borderRadius:12,border:`1.5px solid ${C.border}`,background:"#fff",padding:"16px 18px",marginBottom:14}}>
        <span style={{padding:"3px 10px",borderRadius:5,background:C.greenLight,color:C.green,fontSize:12,fontWeight:600,border:`1px solid ${C.greenMid}`}}>{original.category||"元器件"}</span>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
          <span style={{fontSize:21,fontWeight:700,fontFamily:"'DM Mono',monospace",color:C.text}}>{original.partNumber}</span>
          {(original._dataPath==="local_db"||original._dataPath==="local_db+ai")&&<span style={{padding:"2px 7px",borderRadius:4,background:C.greenLight,color:C.green,fontSize:10,fontWeight:600,border:`1px solid ${C.greenMid}`}}>📦 ezPLM</span>}
          {original._dataPath==="local_db+ai"&&<span style={{padding:"2px 7px",borderRadius:4,background:C.amberBg,color:C.amber,fontSize:10,fontWeight:600,border:"1px solid #f0dca0"}}>+AI补充参数</span>}
          {original._dataPath==="ai_search"&&<span style={{padding:"2px 7px",borderRadius:4,background:C.amberBg,color:C.amber,fontSize:10,fontWeight:600,border:"1px solid #f0dca0"}}>🌐 AI搜索</span>}
        </div>
        {original.manufacturer&&<div style={{fontSize:13,color:C.textMute,marginTop:5}}>{original.manufacturer}</div>}
        {original.description&&<div style={{fontSize:13,color:C.textSec,marginTop:3}}>{original.description}</div>}
        {(original.datasheetUrl||original.footprintFileUrl||original.model3dUrl||original.symbolUrl||original.productUrl)&&(
        <div style={{marginTop:12,paddingTop:12,borderTop:`1px dashed ${C.borderLight}`}}>
          <div style={{fontSize:12,fontWeight:600,color:C.textSec,marginBottom:8}}>📦 库文件与资源</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {original.datasheetUrl&&<a href={original.datasheetUrl} target="_blank" rel="noreferrer" style={RES_BTN}>📄 Datasheet</a>}
            {original.footprintFileUrl&&<a href={original.footprintFileUrl} target="_blank" rel="noreferrer" style={RES_BTN} title={original.footprintFileName}>📐 KiCad封装</a>}
            {original.model3dUrl&&<a href={original.model3dUrl} target="_blank" rel="noreferrer" style={RES_BTN} title={original.model3dFileName}>🧊 3D模型(STEP)</a>}
            {original.symbolUrl&&<a href={original.symbolUrl} target="_blank" rel="noreferrer" style={RES_BTN}>🔣 原理图符号</a>}
            {original.productUrl&&<a href={original.productUrl} target="_blank" rel="noreferrer" style={RES_BTN}>🔗 官网产品页</a>}
          </div>
          <button onClick={()=>onShowSelf&&onShowSelf()}
            style={{marginTop:8,width:"100%",padding:"8px",borderRadius:7,border:`1px solid ${C.greenMid}`,background:C.greenLight,color:C.green,fontSize:12,fontWeight:600,cursor:"pointer"}}>
            🔍 查看图形预览（符号 / 封装 / 3D）与完整详情
          </button>
        </div>)}

        {(original.variants||[]).length>0&&(
          <button onClick={()=>setShowVariants(v=>!v)}
            style={{marginTop:10,width:"100%",padding:"7px",borderRadius:7,border:`1px solid ${C.indigoBorder}`,background:C.indigoBg,color:C.indigo,fontSize:12,fontWeight:600,cursor:"pointer"}}>
            🔄 该型号有 {original.variants.length} 个封装/订货变体 · {showVariants?"收起":"点击切换"}
          </button>)}
        {showVariants&&(<div style={{marginTop:8,maxHeight:220,overflowY:"auto"}}>
          {original.variants.map((v,i)=>(
            <div key={i} onClick={()=>onSwitchVariant&&onSwitchVariant(v)}
              style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:7,border:`1px solid ${C.borderLight}`,marginBottom:5,cursor:"pointer",background:"#fff"}}
              onMouseEnter={e=>{e.currentTarget.style.background=C.greenLight;e.currentTarget.style.borderColor=C.greenMid}}
              onMouseLeave={e=>{e.currentTarget.style.background="#fff";e.currentTarget.style.borderColor=C.borderLight}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,fontFamily:"'DM Mono',monospace",color:C.green}}>{v.pn}</div>
                {v.note&&<div style={{fontSize:10,color:C.textMute,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.note}</div>}
              </div>
              {v.package&&<span style={{fontSize:10,padding:"2px 6px",borderRadius:4,background:C.indigoBg,color:C.indigo,fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap"}}>{v.package}</span>}
            </div>))}
        </div>)}
      </div>

      <div style={{borderRadius:12,border:`1.5px solid ${C.indigoBorder}`,background:"#fff",padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>🏭 优选厂商</div>
        <div style={{fontSize:12,color:C.textMute,marginBottom:10}}>添加优选厂商后，同分候选将优先推荐</div>
        <div style={{display:"flex",gap:6,position:"relative"}}>
          <input value={mfrInput} onChange={e=>setMfrInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addMfr()}}
            placeholder="输入厂商名称搜索…" style={{flex:1,padding:"9px 12px",borderRadius:7,border:`1px solid ${C.border}`,fontSize:13}}/>
          <button onClick={addMfr} style={{padding:"9px 16px",borderRadius:7,border:"none",background:C.indigo,color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",opacity:mfrInput.trim()?1:0.5}}>添加</button>
          {mfrSuggest.length>0&&(<div style={{position:"absolute",top:"100%",left:0,right:70,marginTop:4,background:"#fff",border:`1px solid ${C.border}`,borderRadius:7,boxShadow:"0 8px 24px rgba(0,0,0,0.1)",zIndex:20}}>
            {mfrSuggest.map(m=><div key={m} onClick={()=>{setMfrs([...mfrs,m]);setMfrInput("")}} style={{padding:"8px 12px",fontSize:12,cursor:"pointer",borderBottom:`1px solid ${C.borderLight}`}}>{m}</div>)}
          </div>)}
        </div>
        {mfrs.length>0&&(<div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
          {mfrs.map(m=>(<span key={m} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:14,background:C.indigoBg,color:C.indigo,fontSize:12,border:`1px solid ${C.indigoBorder}`}}>
            ⭐ {m}<span onClick={()=>setMfrs(mfrs.filter(x=>x!==m))} style={{cursor:"pointer",fontWeight:700}}>×</span></span>))}
        </div>)}
      </div>

      <div style={{borderRadius:12,border:`1.5px solid ${C.border}`,background:"#fff",padding:"14px 16px",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontSize:14,fontWeight:700}}>📊 参数优先级与范围</span>
          <span style={{fontSize:11,color:C.textMute}}>拖拽排序 · 点击设约束</span>
        </div>
        {params.map((p,i)=>(<ParamRow key={p.id} p={p} index={i} con={constraints[p.id]} onSetCon={setCon}
          onDragStart={onDragStart} onDragOver={onDragOver} onDrop={onDrop} dragging={dragging}/>))}
      </div>

      <div style={{borderRadius:12,border:`1.5px solid ${C.border}`,background:"#fff",padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>🎯 应用领域</div>
        <div style={{fontSize:11,color:C.textMute,marginBottom:10}}>不同应用下最优替代料不同，将调整参数权重与硬约束</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
          {APPLICATIONS.map(a=>(<button key={a.code} onClick={()=>setApplication(a.code)} title={a.desc}
            style={{padding:"8px 6px",borderRadius:8,borderWidth:1.5,borderStyle:"solid",
              borderColor:application===a.code?C.green:C.border,
              background:application===a.code?C.greenLight:"#fff",cursor:"pointer",textAlign:"center"}}>
            <div style={{fontSize:17}}>{a.icon}</div>
            <div style={{fontSize:11,fontWeight:600,color:C.text,marginTop:2}}>{a.label}</div>
          </button>))}
        </div>
        {application!=="generic"&&<div style={{marginTop:8,fontSize:11,color:C.indigo,background:C.indigoBg,border:`1px solid ${C.indigoBorder}`,borderRadius:6,padding:"6px 8px"}}>
          💡 已按「{APPLICATIONS.find(a=>a.code===application)?.label}」重排参数优先级：{APPLICATIONS.find(a=>a.code===application)?.desc}
        </div>}
      </div>

      <div style={{borderRadius:12,border:`1.5px solid ${C.border}`,background:"#fff",padding:"14px 16px",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:700,marginBottom:10}}>🔀 替代模式</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {SUB_MODES.map(m=>{
            const disabled=m.id==="pin2pin"&&original._pkgConfirmed===false;
            return(<button key={m.id} disabled={disabled} onClick={()=>!disabled&&setMode(m.id)}
              title={disabled?"封装未限定，无法评估引脚兼容性。请返回选择具体封装型号后使用":""}
              style={{padding:"9px 12px",borderRadius:8,borderWidth:1.5,borderStyle:"solid",
                borderColor:disabled?"#e0e0e0":mode===m.id?C.green:C.border,
                background:disabled?"#f5f5f5":mode===m.id?C.greenLight:"#fff",
                cursor:disabled?"not-allowed":"pointer",textAlign:"left",opacity:disabled?0.55:1}}>
              <div style={{fontSize:13,fontWeight:600,color:disabled?C.textMute:C.text}}>{m.label}{disabled&&" 🔒"}</div>
              <div style={{fontSize:10,color:C.textMute}}>{disabled?"封装未限定，不可用":m.desc}</div>
            </button>);})}
        </div>
        {original._pkgConfirmed===false&&<div style={{marginTop:8,fontSize:11,color:C.textMute}}>💡 未限定封装时无法做 Pin-to-Pin 判定。如需该模式，请重新搜索并选择具体封装型号。</div>}
      </div>

      <button onClick={runRecommend} disabled={phase==="loading"}
        style={{width:"100%",padding:"14px",borderRadius:10,border:"none",background:phase==="loading"?C.greenAccent:C.green,color:"#fff",fontSize:15,fontWeight:700,cursor:phase==="loading"?"wait":"pointer",letterSpacing:1}}>
        {phase==="loading"?"⏳ 推荐中…":phase==="done"?"🔄 重新推荐":"🚀 AI 智能推荐"}
      </button>
      <button onClick={onBack} style={{width:"100%",marginTop:8,padding:"9px",borderRadius:8,border:`1px solid ${C.border}`,background:"#fff",color:C.textSec,fontSize:13,cursor:"pointer"}}>← 重新搜索</button>
    </div>

    {/* ══ 右栏 ══ */}
    <div style={{minHeight:400}}>
      {note&&<div style={{padding:"8px 14px",borderRadius:7,background:C.amberBg,border:"1px solid #f0dca0",color:"#854f0b",fontSize:12,marginBottom:12}}>ℹ️ {note}</div>}
      {phase==="idle"&&(<div style={{textAlign:"center",paddingTop:150,color:C.textMute}}>
        <div style={{fontSize:16,fontWeight:600,color:C.textSec,marginBottom:6}}>调整参数后，点击「AI 智能推荐」</div>
        <div style={{fontSize:13}}>AI推荐候选 → 本地库校验 → 算法评分 → 输出 Top 5</div>
      </div>)}
      {phase==="loading"&&(<div style={{textAlign:"center",paddingTop:150,color:C.textMute}}>
        <div style={{width:38,height:38,border:`3px solid ${C.borderLight}`,borderTopColor:C.green,borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 14px"}}/>
        正在推荐（AI候选 → 本地库校验 → 评分淘汰），约需 10–30 秒…
      </div>)}
      {phase==="done"&&result&&(<div style={{animation:"fadeUp 0.4s ease both"}}>
        {result.recommendations.some(r=>r._lowConfidence)&&(<div style={{padding:"8px 14px",borderRadius:7,background:C.amberBg,border:"1px solid #f0dca0",color:"#854f0b",fontSize:12,marginBottom:12}}>⚠ 以下候选的证据可信度低于常规阈值（多为AI来源且资料不全），仅供参考方向，务必人工核对 datasheet 后再决策</div>)}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <h3 style={{fontSize:16,fontWeight:700}}>推荐结果 <span style={{fontSize:13,color:C.textMute,fontWeight:400}}>· {result.recommendations.length} 个替代方案{result.basePrice!=null?` · 原型号 $${result.basePrice}`:""} · 点击型号查看采购详情</span></h3>
          <div style={{display:"flex",gap:6}}>
            <div style={{display:"flex",borderRadius:7,border:`1px solid ${C.border}`,overflow:"hidden"}}>
              <button onClick={()=>setView("cards")} style={{padding:"5px 14px",border:"none",background:view==="cards"?C.green:"#fff",color:view==="cards"?"#fff":C.textSec,fontSize:12,cursor:"pointer"}}>卡片</button>
              <button onClick={()=>setView("table")} style={{padding:"5px 14px",border:"none",background:view==="table"?C.green:"#fff",color:view==="table"?"#fff":C.textSec,fontSize:12,cursor:"pointer"}}>对比表</button>
            </div>
            <button onClick={exportMD} style={{padding:"5px 12px",borderRadius:7,border:`1px solid ${C.border}`,background:"#fff",fontSize:12,cursor:"pointer"}}>📄 MD</button>
            <button onClick={exportCSV} style={{padding:"5px 12px",borderRadius:7,border:`1px solid ${C.border}`,background:"#fff",fontSize:12,cursor:"pointer"}}>📊 CSV</button>
          </div>
        </div>
        {view==="cards"
          ?result.recommendations.map((rec,i)=><ResultCard key={rec.partNumber} rec={rec} index={i} market={market} onShowDetail={(pn,r)=>{setDetailPN(pn);setDetailRec(r)}}/>)
          :<CompareTable original={original} recs={result.recommendations}/>}
        {(result.eliminated||[]).length>0&&(<details style={{marginTop:12,borderRadius:10,border:`1px solid ${C.borderLight}`,background:"#fff"}}>
          <summary style={{padding:"11px 16px",cursor:"pointer",fontSize:13,color:C.textSec,fontWeight:500}}>🚫 被淘汰的候选（{result.eliminated.length}个）</summary>
          <div style={{padding:"0 16px 12px"}}>
            {result.eliminated.map((e,i)=>(<div key={i} style={{display:"flex",gap:12,padding:"6px 0",borderBottom:`1px solid ${C.borderLight}`,fontSize:12}}>
              <span style={{fontFamily:"'DM Mono',monospace",fontWeight:600,color:C.textSec,minWidth:130}}>{e.partNumber}</span>
              <span style={{color:"#c0392b",flex:1}}>{e.reason}</span>
            </div>))}
          </div>
        </details>)}
      </div>)}
      {detailPN&&<PartDetailModal pn={detailPN} rec={detailRec} onClose={()=>{setDetailPN(null);setDetailRec(null)}}/>}
    </div>
  </div>);
}

// ═══ 主应用 ═══
function App(){
  const[page,setPage]=useState("home");
  const[original,setOriginal]=useState(null);
  const[busy,setBusy]=useState(false);
  const[demoNote,setDemoNote]=useState("");
  const[homeErr,setHomeErr]=useState("");
  const[variantBase,setVariantBase]=useState(null);

  const analyze=async(pn)=>{
    setBusy(true);setDemoNote("");setHomeErr("");
    try{
      const r=await fetch("/api/v2/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({partNumber:pn})});
      const d=await r.json().catch(()=>null);
      if(d&&d.success&&d.original?.parameters?.length){
        if((d.original.variants||[]).length>=2){
          setVariantBase(d.original);setPage("variants");   // 基础型号有多个封装变体 → 先让用户确认
        }else{
          setOriginal({...d.original,_pkgConfirmed:true});setPage("workbench");
        }
      }else if(pn.toUpperCase()==="STM32F103C8T6"){
        setOriginal({...MOCK_ORIGINAL,_pkgConfirmed:true});setDemoNote("演示模式");setPage("workbench");
      }else{
        setHomeErr(d&&d.success===false?`参数查询失败：${d.error||"未知错误"}`:"参数查询失败，请稍后重试");
      }
    }catch(e){
      if(pn.toUpperCase()==="STM32F103C8T6"){setOriginal(MOCK_ORIGINAL);setPage("workbench");}
      else setHomeErr("网络错误或超时，请重试");
    }finally{setBusy(false);}
  };

  return(<React.Fragment>
    <header style={{background:"#fff",borderBottom:`1px solid ${C.border}`,padding:"12px 24px"}}>
      <div style={{maxWidth:1400,margin:"0 auto",display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:38,height:38,borderRadius:9,background:C.green,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="#fff" strokeWidth="1.8" fill="none"/><path d="M12 7v10M7 9.5l5 3 5-3" stroke="#fff" strokeWidth="1.5" strokeLinecap="round"/></svg>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:17,fontWeight:700,color:C.text}}>AltPart Pro</div>
          <div style={{fontSize:11,color:C.textMute}}>元器件替代决策智能体 · ezPLM集成</div>
        </div>
        {page==="workbench"&&<button onClick={()=>setPage("home")} style={{padding:"8px 16px",borderRadius:8,border:`1px solid ${C.border}`,background:"#fff",color:C.textSec,fontSize:13,cursor:"pointer"}}>← 重新搜索</button>}
      </div>
    </header>
    <main style={{minHeight:"calc(100vh - 130px)"}}>
      {page==="home"&&<HomePage onSubmit={analyze} busy={busy} err={homeErr}/>}
      {page==="variants"&&variantBase&&<VariantPicker base={variantBase}
        onPick={v=>{
          const params=(variantBase.parameters||[]).map(p=>
            (p.name.includes("封装")||String(p.nameEn||"").toLowerCase().includes("package"))&&v.package
              ?{...p,value:v.package}:p);
          setOriginal({...variantBase,partNumber:v.pn,parameters:params,variants:[],_pkgConfirmed:true});
          setPage("workbench");
        }}
        onSkip={()=>{setOriginal({...variantBase,variants:[],_pkgConfirmed:false});setPage("workbench")}}
        onBack={()=>setPage("home")}/>}
      {page==="workbench"&&original&&<Workbench key={original.partNumber} original={original} demoNote={demoNote} onBack={()=>setPage("home")} onSwitchVariant={v=>analyze(v.pn)}/>}
    </main>
    <footer style={{textAlign:"center",padding:"14px",borderTop:`1px solid ${C.borderLight}`,fontSize:12,color:C.textMute,background:"#fff"}}>
      AltPart Pro v3.0 · ezPLM元器件库 · 实时行情 · 场景化替代 · 确定性评分
    </footer>
  </React.Fragment>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
